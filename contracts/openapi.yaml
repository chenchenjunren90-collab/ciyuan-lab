openapi: 3.1.0
info:
  title: 词元研究所 API
  version: 0.3.0
  description: >-
    三周 MVP 的最小学习闭环公共契约（ARCH-01 已冻结）。

    覆盖「初始测评 → 学习画像 → 学习计划 → 知识点/问答 → 练习与确定性验证 → 画像更新 → 下一任务推荐」的完整闭环。

    身份说明：本阶段无真实认证，`student_id` 为平台内部不透明标识（随机 ID），
    不得使用姓名或明文学号；每个学习接口都显式携带 `student_id`，后续身份/认证边界单独记录为已知限制。
servers:
  - url: http://localhost:8000
    description: 本地开发
paths:
  /health:
    get:
      operationId: rootHealth
      summary: 服务存活检查
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/health:
    get:
      operationId: apiHealth
      summary: 版本化服务健康检查
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/capabilities:
    get:
      operationId: listCapabilities
      summary: 返回 MVP 已规划的平台能力模块
      responses:
        "200":
          description: 模块清单；scaffold 不代表业务功能已完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
  /api/v1/courses:
    get:
      operationId: listCourses
      summary: 返回三门课程及其真实建设状态
      responses:
        "200":
          description: 课程清单
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseSummary"
  /api/v1/courses/{course_id}/knowledge-points:
    get:
      operationId: listKnowledgePoints
      summary: 课程知识点目录（学习入口与知识卡来源）
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
      responses:
        "200":
          description: 该课程的知识点目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePointList"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{course_id}/knowledge-points/{knowledge_point_id}:
    get:
      operationId: getKnowledgePoint
      summary: 返回学生可见的完整知识卡
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
        - name: knowledge_point_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 知识点详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePointDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{course_id}/activities:
    get:
      operationId: listActivities
      summary: 返回练习、Debug与综合项目目录
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
        - name: knowledge_point_id
          in: query
          required: false
          schema:
            type: string
        - name: learning_stage
          in: query
          required: false
          schema:
            type: string
            enum: [diagnostic, in_class, after_class, challenge]
      responses:
        "200":
          description: 学习活动目录
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivitySummary"
  /api/v1/courses/{course_id}/activities/{activity_id}:
    get:
      operationId: getActivity
      summary: 返回学生可见活动内容，不包含答案和隐藏测试
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
        - name: activity_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 学习活动详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/courses/{course_id}/projects/{project_id}/scenario:
    get:
      operationId: getProjectScenario
      summary: 返回受限课后项目的驼灵或固定合成场景背景
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已授权的项目场景上下文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioContext"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: 活动不是允许调用场景服务的课后综合项目
  /api/v1/courses/{course_id}/scenario-projects/generate:
    post:
      operationId: generateSyntheticScenarioProject
      summary: 在已审核模板边界内生成个性化课后综合项目
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioProjectNeed"
      responses:
        "200":
          description: 受控生成或固定降级的合成项目
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedScenarioProject"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: 模板、课程或知识点不符合生成边界
  /api/v1/courses/{course_id}/sources:
    get:
      operationId: listSources
      summary: 返回课程已登记来源及RAG资格
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
      responses:
        "200":
          description: 来源目录
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceDetail"
  /api/v1/courses/{course_id}/sources/{source_id}:
    get:
      operationId: getSource
      summary: 返回一个可核验来源
      parameters:
        - name: course_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
        - name: source_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 来源详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/assessments:
    post:
      operationId: submitAssessment
      summary: 提交测评并生成初始画像与阶段计划
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentRequest"
      responses:
        "200":
          description: 测评结果，含画像快照与学情规划阶段计划
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/diagnostics:
    get:
      operationId: getDiagnosticQuiz
      summary: 获取不含答案的初始诊断或阶段重测题
      parameters:
        - name: course_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
        - name: phase
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/DiagnosticPhase"
      responses:
        "200":
          description: 公开诊断题；不返回答案键
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticQuiz"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/diagnostics/submissions:
    post:
      operationId: submitDiagnosticQuiz
      summary: 由服务器判定诊断答案并更新画像与学习计划
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticSubmissionRequest"
      responses:
        "200":
          description: 诊断得分、逐题结果、画像与学习计划
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticSubmissionResult"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/adaptive-problems/generate:
    post:
      operationId: generateAdaptiveProblem
      summary: 根据 Python 学习画像生成确定性变式编程题
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateProblemRequest"
      responses:
        "200":
          description: 不含隐藏测试的学生侧题面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedCodeProblem"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/adaptive-problems/{problem_id}/submissions:
    post:
      operationId: submitAdaptiveProblem
      summary: 使用隔离沙箱与隐藏测试验证个性化 Python 题
      parameters:
        - name: problem_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratedProblemSubmissionRequest"
      responses:
        "200":
          description: 验证事实、更新后的画像与下一道变式题
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedProblemSubmissionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/qa:
    post:
      operationId: askQuestion
      summary: 基于课程知识库的问答（RAG，带可核验来源）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QaRequest"
      responses:
        "200":
          description: 回答；依据不足时 status=insufficient_evidence 且 answer 为空
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QaResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/exercises/{exercise_id}/submissions:
    post:
      operationId: submitExercise
      summary: 提交练习（客观题/简答/代码/Debug），返回确定性验证与反馈
      parameters:
        - name: exercise_id
          in: path
          required: true
          description: 练习 ID（如 PY-FUNC-01-C1）
          schema:
            type: string
        - name: course_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionRequest"
      responses:
        "200":
          description: 验证结果、课程辅导反馈、画像更新与下一任务推荐
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/profile:
    get:
      operationId: getProfile
      summary: 查询学习画像与掌握度
      parameters:
        - name: student_id
          in: query
          required: true
          schema:
            type: string
        - name: course_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
      responses:
        "200":
          description: 学习画像
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerProfile"
  /api/v1/next-activity:
    get:
      operationId: getNextActivity
      summary: 获取下一任务推荐
      parameters:
        - name: student_id
          in: query
          required: true
          schema:
            type: string
        - name: course_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
      responses:
        "200":
          description: 下一活动（只引用已存在的知识点/练习 ID）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextActivity"
  /api/v1/activities/{activity_id}/hint:
    post:
      operationId: createProgressiveHint
      summary: 返回不泄露答案的三级递进提示
      parameters:
        - name: activity_id
          in: path
          required: true
          schema:
            type: string
        - name: course_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HintRequest"
      responses:
        "200":
          description: 当前层级提示
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HintResponse"
  /api/v1/projects/{project_id}/submissions:
    post:
      operationId: recordProjectEvidence
      summary: 记录综合项目材料与自测证据
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: course_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectSubmissionRequest"
      responses:
        "200":
          description: 已接收但尚未评分的评审记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSubmissionResponse"
  /api/v1/classroom/sessions/next:
    get:
      operationId: getNextClassroomSession
      tags: [classroom]
      parameters:
        - in: query
          name: student_id
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: query
          name: daily_minutes
          required: false
          schema: { type: integer, minimum: 20, maximum: 120, default: 30 }
        - in: query
          name: preferred_mode
          required: false
          schema:
            type: string
            enum: [step_by_step, example_first, practice_first]
            default: step_by_step
        - in: query
          name: self_profile_level
          required: false
          description: 课程规划智能体识别出的学习起点；明确的零基础倾向优先于短测分数。
          schema:
            type: string
            enum: [newcomer, beginner, developing, experienced]
      responses:
        "200":
          description: 根据画像和课程图生成的下一节个性化课堂
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomLesson"
        "404":
          description: 尚未建立学习画像
  /api/v1/classroom/lessons/{lesson_id}:
    get:
      operationId: getClassroomLesson
      summary: 获取 Python 沉浸式课堂的教学脚本与公开任务
      parameters:
        - name: lesson_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 课堂角色、教学节拍、理解检查与公开代码任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomLesson"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/classroom/checkpoints:
    post:
      operationId: evaluateClassroomCheckpoint
      summary: 对课堂理解检查进行确定性判定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomCheckpointRequest"
      responses:
        "200":
          description: 检查结果与对应课堂角色的反馈
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomCheckpointResult"
  /api/v1/classroom/dialogue:
    post:
      operationId: answerClassroomDialogue
      summary: 使用课程辅导智能体的课堂人格开展可溯源对话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomDialogueRequest"
      responses:
        "200":
          description: 经过课程检索与质量监督的角色化回答
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomDialogueResponse"
  /api/v1/classroom/self-profile:
    post:
      operationId: assessClassroomSelfProfile
      summary: 将学生自述与 Python 系统课程路线进行保守匹配
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomSelfProfileRequest"
      responses:
        "200":
          description: 经课程检索与质量监督的自述初判，仍需客观测评校正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomSelfProfileResponse"
components:
  responses:
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: 请求校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HTTPValidationError:
      type: object
      required: []
      additionalProperties: null
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      type: object
      required: [loc, msg, type]
      additionalProperties: null
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
        input: {}
        ctx:
          type: object
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        version:
          type: string
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [status, code_execution_enabled, tuoling_enabled, modules]
      properties:
        status:
          type: string
          const: mvp
        code_execution_enabled:
          type: boolean
        tuoling_enabled:
          type: boolean
        modules:
          type: array
          items:
            type: string
            enum:
              - orchestration
              - rag
              - learner_profile
              - practice
              - model_adapters
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: 稳定的机器可读错误码（如 MODEL_TIMEOUT、NOT_FOUND、VALIDATION_ERROR）
        message:
          type: string
          description: 面向学生的友好提示，不含堆栈或敏感原文
    CourseId:
      type: string
      enum: [c, python, data_structures]
    CourseSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - target_core_concepts
        - implemented_core_concepts
        - features
      properties:
        id:
          $ref: "#/components/schemas/CourseId"
        title:
          type: string
        status:
          type: string
        target_core_concepts:
          type: integer
          minimum: 0
        implemented_core_concepts:
          type: integer
          minimum: 0
        features:
          type: object
          additionalProperties:
            type: string
    KnowledgePointSummary:
      type: object
      additionalProperties: false
      required: [id, title, difficulty, prerequisites, concepts, source_refs]
      properties:
        id:
          type: string
          description: 稳定且全局唯一，如 C-PTR-01、PY-FUNC-01、DS-TREE-01
        title:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        prerequisites:
          type: array
          items:
            type: string
        concepts:
          type: array
          description: 该核心节点下可展示与检索的细分技能单元
          items:
            type: string
        source_refs:
          type: array
          description: 该知识点的来源 ID（可核验）
          items:
            type: string
    KnowledgePointDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - course
        - difficulty
        - estimated_minutes
        - prerequisites
        - learning_objectives
        - concepts
        - lesson
        - assessment_ids
        - source_refs
        - status
      properties:
        id:
          type: string
        title:
          type: string
        course:
          $ref: "#/components/schemas/CourseId"
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        estimated_minutes:
          type: integer
          minimum: 1
        prerequisites:
          type: array
          items:
            type: string
        learning_objectives:
          type: array
          items:
            type: string
        concepts:
          type: array
          items:
            type: string
        lesson:
          type: object
        assessment_ids:
          type: array
          items:
            type: string
        source_refs:
          type: array
          items:
            type: string
        status:
          type: string
    KnowledgePointList:
      type: object
      additionalProperties: false
      required: [course_id, items]
      properties:
        course_id:
          $ref: "#/components/schemas/CourseId"
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgePointSummary"
    ActivitySummary:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - course
        - type
        - difficulty
        - estimated_minutes
        - concept_ids
        - source_refs
      properties:
        id:
          type: string
        title:
          type: string
        course:
          $ref: "#/components/schemas/CourseId"
        type:
          type: string
          enum: [objective, short_answer, code, debug, project]
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        estimated_minutes:
          type: integer
          minimum: 1
        concept_ids:
          type: array
          items:
            type: string
        source_refs:
          type: array
          items:
            type: string
        learning_stage:
          type: [string, "null"]
          enum: [diagnostic, in_class, after_class, challenge, null]
    ActivityDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - course
