name: Foundation courses — tests only

on:
  push:
    branches: [feat/python-adaptive-multi-agent-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install existing dependencies
        run: |
          python -m pip install -e '.[dev]'
          npm ci --prefix apps/web
      - name: Validate course structure and changed Python code
        run: |
          python scripts/validate_course_pack.py
          python -m ruff check apps/api/app/modules/rag/retriever.py apps/api/tests/test_foundation_classroom_content.py apps/api/tests/test_foundation_retrieval_aliases.py apps/api/tests/test_external_course_adaptations.py apps/api/tests/test_external_c_sandbox.py
      - name: Prepare isolated C and Python runtimes
        run: |
          docker info
          docker pull gcc:13.4.0-bookworm
          docker pull python:3.11.15-alpine3.24
      - name: Course, RAG, contract and real-sandbox acceptance
        env:
          CIYUAN_REQUIRE_C_SANDBOX: '1'
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api
        run: |
          mkdir -p output/ci-validation
          cd output/ci-validation
          python -m pytest ../../apps/api/tests/test_foundation_classroom_content.py ../../apps/api/tests/test_foundation_retrieval_aliases.py ../../apps/api/tests/test_external_course_adaptations.py ../../apps/api/tests/test_external_c_sandbox.py ../../apps/api/tests/test_practice_docker_integration.py ../../apps/api/tests/test_course_content_api.py ../../apps/api/tests/test_course_content_audit.py ../../apps/api/tests/test_validate_course_pack.py ../../apps/api/tests/test_contracts.py ../../apps/api/tests/test_rag_ingestion.py ../../apps/api/tests/test_rag_hybrid.py ../../apps/api/tests/test_rag_evaluation.py -q
      - name: Frontend typecheck, tests and production build
        working-directory: apps/web
        run: npm run check

# Deliberately no deploy job, SSH, server credentials, image publishing or main merge.
