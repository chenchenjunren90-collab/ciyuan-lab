id: PY-BASE-06
title: while 循环
course: python
schema_version: 0.1.0
version: 1
difficulty: beginner
estimated_minutes: 40
prerequisites:
- PY-BASE-03
learning_objectives:
- 能使用 while 实现重复执行
- 能设计循环条件与终止条件以避免死循环
concepts:
- while
- 循环条件
- 计数器
- 死循环
lesson:
  summary: 使用 while 在条件成立时重复执行代码块，掌握计数器与循环终止条件的写法。
  key_points:
  - while 先判断条件，条件为假时循环体一次也不执行
  - 常用计数器变量在循环体内递增，直至条件不成立
  - 条件始终为真且无终止路径会导致死循环
  examples:
  - "i = 0\nwhile i < 5:\n    print(i)\n    i += 1"
  common_mistakes:
  - 忘记更新循环变量导致死循环
assessment_ids:
- PY-BASE-06-Q1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
