id: PY-BASE-06
title: while 循环
course: python
schema_version: 0.1.0
version: 2
difficulty: beginner
estimated_minutes: 40
prerequisites:
- PY-BASE-03
learning_objectives:
- 能使用 while 实现重复执行
- 能设计循环条件与终止条件以避免死循环
concepts:
- while
- 循环条件
- 计数器
- 死循环
lesson:
  summary: 使用 while 在条件成立时重复执行代码块，掌握计数器与循环终止条件的写法。 本节围绕“while 循环”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - while 先判断条件，条件为假时循环体一次也不执行
  - 常用计数器变量在循环体内递增，直至条件不成立
  - 条件始终为真且无终止路径会导致死循环
  examples:
  - "i = 0\nwhile i < 5:\n    print(i)\n    i += 1"
  common_mistakes:
  - 忘记更新循环变量导致死循环
  - 忽略“while 循环”的适用前提，直接套用结论或代码模板。
  - 完成“while 循环”实现后只检查一个正常样例，没有验证边界和失败路径。
assessment_ids:
- PY-BASE-06-Q1
