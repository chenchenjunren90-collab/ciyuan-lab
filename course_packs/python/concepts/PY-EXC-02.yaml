id: PY-EXC-02
title: 自定义异常
course: python
schema_version: 0.1.0
version: 2
difficulty: advanced
estimated_minutes: 40
prerequisites:
- PY-EXC-01
learning_objectives:
- 能定义自定义异常类
- 能使用 raise 主动抛出异常
concepts:
- raise
- 自定义异常
- 异常继承
lesson:
  summary: 通过继承 Exception 定义自定义异常，并使用 raise 主动抛出。 本节围绕“自定义异常”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 自定义异常类通常继承 Exception
  - raise 主动抛出异常实例
  - 抛出的自定义异常可被 except 捕获
  examples:
  - 'class MyError(Exception): pass'
  common_mistakes:
  - 自定义异常类未继承 Exception 导致无法被常规捕获
  - 忽略“自定义异常”的适用前提，直接套用结论或代码模板。
  - 完成“自定义异常”实现后只检查一个正常样例，没有验证边界和失败路径。
assessment_ids:
- PY-EXC-02-Q1
source_refs:
