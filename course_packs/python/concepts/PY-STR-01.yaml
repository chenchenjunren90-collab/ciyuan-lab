id: PY-STR-01
title: 字符串基础
course: python
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 40
prerequisites:
- PY-BASE-02
learning_objectives:
- 能创建字符串并使用转义字符
- 能进行字符串拼接与重复
concepts:
- 字符串
- 转义
- 拼接
- 重复
lesson:
  summary: 掌握字符串的创建、转义字符、拼接（+）与重复（*）等基本操作。关键要点包括：字符串用单引号或双引号包裹；+ 拼接字符串，* 重复字符串；\n、\t 等转义字符表示特殊字符。
  key_points:
  - 字符串用单引号或双引号包裹
  - + 拼接字符串，* 重复字符串
  - \n、\t 等转义字符表示特殊字符
  examples:
  - 代码示例：text='data' 时 text[1] 为 'a'、len(text) 为 4；尝试 text[0]='D' 会抛出 TypeError。
  common_mistakes:
  - 误以为字符串可以通过 text[0]='A' 原地修改字符
  - 误以为len(text) 始终等于 UTF-8 编码后的字节数
assessment_ids:
- PY-STR-01-Q1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
- SRC-PY-GUIDE-BASE
status: draft
