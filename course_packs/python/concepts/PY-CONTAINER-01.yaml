id: PY-CONTAINER-01
title: 容器嵌套与选择
course: python
schema_version: 0.1.0
version: 2
difficulty: intermediate
estimated_minutes: 50
prerequisites:
- PY-LIST-02
- PY-DICT-02
- PY-SET-01
learning_objectives:
- 能构造嵌套容器（列表套字典等）
- 能根据场景选择合适的容器类型
concepts:
- 嵌套结构
- 容器选择
- 数据结构
lesson:
  summary: 综合运用列表、字典、集合等容器构造嵌套结构，并能根据数据特点选择合适的容器。 本节围绕“容器嵌套与选择”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 列表保持顺序，字典按键取值，集合去重
  - 可构造列表套字典等嵌套结构表达复杂数据
  - 按键快速查找应选择字典
  examples:
  - 'records = [{"name": "a", "score": 90}, ...]'
  common_mistakes:
  - 需要按键查找却选择了列表
  - 忽略“容器嵌套与选择”的适用前提，直接套用结论或代码模板。
  - 完成“容器嵌套与选择”实现后只检查一个正常样例，没有验证边界和失败路径。
assessment_ids:
- PY-CONTAINER-01-Q1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
- SRC-PY-GUIDE-BASE
