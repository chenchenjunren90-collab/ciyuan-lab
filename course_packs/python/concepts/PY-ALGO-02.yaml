id: PY-ALGO-02
title: 递归初步
course: python
schema_version: 0.1.0
version: 2
difficulty: advanced
estimated_minutes: 50
prerequisites:
- PY-FUNC-01
learning_objectives:
- 能理解递归的基本思想
- 能实现阶乘、斐波那契等简单递归函数
concepts:
- 递归
- 基线条件
- 递归条件
- 栈
lesson:
  summary: 理解递归的基线条件与递归条件，实现阶乘、斐波那契等简单递归函数。 本节围绕“递归初步”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 递归函数直接或间接调用自身
  - 基线条件是递归停止、不再调用自身的分支
  - 缺少基线条件会导致无限递归与栈溢出
  examples:
  - 'def fact(n): return 1 if n == 0 else n * fact(n - 1)  # 前置条件：n 为非负整数'
  common_mistakes:
  - 递归没有基线条件导致 RecursionError
  - 未声明输入范围，使负数等非法输入无法到达基线条件
assessment_ids:
- PY-ALGO-02-Q1
source_refs:
