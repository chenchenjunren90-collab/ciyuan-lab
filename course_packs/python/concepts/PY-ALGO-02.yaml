id: PY-ALGO-02
title: 递归初步
course: python
schema_version: 0.1.0
version: 1
difficulty: advanced
estimated_minutes: 50
prerequisites:
- PY-FUNC-01
learning_objectives:
- 能理解递归的基本思想
- 能实现阶乘、斐波那契等简单递归函数
concepts:
- 递归
- 基线条件
- 递归条件
- 栈
lesson:
  summary: 理解递归的基线条件与递归条件，实现阶乘、斐波那契等简单递归函数。
  key_points:
  - 递归函数直接或间接调用自身
  - 基线条件是递归停止、不再调用自身的分支
  - 缺少基线条件会导致无限递归与栈溢出
  examples:
  - 'def fact(n): return 1 if n <= 1 else n * fact(n - 1)'
  common_mistakes:
  - 递归没有基线条件导致 RecursionError
assessment_ids:
- PY-ALGO-02-Q1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
status: draft
