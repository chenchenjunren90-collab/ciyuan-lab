id: PY-FUNC-02
title: 参数与返回值
course: python
schema_version: 0.1.0
version: 2
difficulty: intermediate
estimated_minutes: 50
prerequisites:
- PY-FUNC-01
learning_objectives:
- 能使用位置、关键字与默认参数
- 能返回单个或多个值
concepts:
- 位置参数
- 关键字参数
- 默认值
- 多返回值
lesson:
  summary: 掌握位置参数、关键字参数、默认参数与多返回值的用法与调用规则。 本节围绕“参数与返回值”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 位置参数按顺序绑定，关键字参数按名称绑定，调用必须满足函数签名。
  - 默认值在函数定义时求值，不能把可变对象直接作为会被修改的默认值。
  - 返回多个结果本质上是返回元组，调用方应明确每个位置的语义。
  examples:
  - '代码示例：def append_item(item, items=None): items = [] if items is None else items; items.append(item);
    return items'
  common_mistakes:
  - 使用 items=[] 作为可变默认值，多个调用共享同一列表。
  - 混淆 print 和 return，导致函数难以复用和测试。
assessment_ids:
- PY-FUNC-02-C1
