id: PY-FUNC-01
title: 函数定义与调用
course: python
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 50
prerequisites:
- PY-BASE-10
learning_objectives:
- 能使用 def 定义函数
- 能调用函数并接收返回值
concepts:
- def
- 调用
- 返回值
- 参数
lesson:
  summary: 使用 def 定义带参数和返回值的函数，理解函数封装可复用逻辑的意义。关键要点包括：def 创建函数对象并绑定名称，函数体只在调用时执行；参数接收输入，return 结束当前调用并返回结果；省略 return 时返回 None；函数应职责单一、输入输出明确，并尽量把文件和网络副作用留在边界层。
  key_points:
  - def 创建函数对象并绑定名称，函数体只在调用时执行。
  - 参数接收输入，return 结束当前调用并返回结果；省略 return 时返回 None。
  - 函数应职责单一、输入输出明确，并尽量把文件和网络副作用留在边界层。
  examples:
  - '代码示例：def add(a: int, b: int) -> int: return a + b'
  common_mistakes:
  - 误以为函数体在执行 def 时立即运行一次
  - 误以为函数没有显式 return 时会返回空字符串
assessment_ids:
- PY-FUNC-01-C1
