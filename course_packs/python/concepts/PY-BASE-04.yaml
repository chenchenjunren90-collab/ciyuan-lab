id: PY-BASE-04
title: 输入与输出
course: python
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 30
prerequisites:
- PY-BASE-02
learning_objectives:
- 能使用 input 读取用户输入
- 能使用 print 输出结果
concepts:
- input
- print
- 格式化输出
- 类型转换
lesson:
  summary: 掌握 input 读取输入与 print 输出结果的方法，理解输入默认是字符串、必要时需进行类型转换。关键要点包括：input 每次返回去掉行尾的字符串，数值计算前必须完成显式转换；print 可通过 sep、end 和格式化字符串控制输出，评测输出必须严格匹配约定；解析失败应给出清晰错误或受控退出，不能让未校验数据进入后续计算。
  key_points:
  - input 每次返回去掉行尾的字符串，数值计算前必须完成显式转换。
  - print 可通过 sep、end 和格式化字符串控制输出，评测输出必须严格匹配约定。
  - 解析失败应给出清晰错误或受控退出，不能让未校验数据进入后续计算。
  examples:
  - 代码示例：count = int(input().strip()); print(f'count={count}')
  common_mistakes:
  - 误以为elif 分支会在前面条件成立后继续逐项执行
  - 误以为非空字符串 'False' 在条件判断中是假值
