id: PY-BASE-04
title: 输入与输出
course: python
schema_version: 0.1.0
version: 1
difficulty: beginner
estimated_minutes: 30
prerequisites:
- PY-BASE-02
learning_objectives:
- 能使用 input 读取用户输入
- 能使用 print 输出结果
concepts:
- input
- print
- 格式化输出
- 类型转换
lesson:
  summary: 掌握 input 读取输入与 print 输出结果的方法，理解输入默认是字符串、必要时需进行类型转换。
  key_points:
  - input() 始终返回字符串，参与数值运算前需先转换类型
  - print 可用逗号分隔多个输出项，也可用 f-string 格式化
  - int()/float() 把字符串转换为数值
  examples:
  - 'age = int(input("请输入年龄: "))'
  common_mistakes:
  - 直接把 input() 结果当数值参与运算
assessment_ids:
- PY-BASE-04-Q1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
status: draft
