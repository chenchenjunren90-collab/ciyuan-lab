id: PY-FILE-02
title: 上下文管理器 with
course: python
schema_version: 0.1.0
version: 1
difficulty: beginner
estimated_minutes: 40
prerequisites:
- PY-FILE-01
learning_objectives:
- 能使用 with 语句安全管理资源
- 能解释 with 自动释放资源的原理
concepts:
- with
- 上下文管理器
- 自动关闭
lesson:
  summary: 使用 with 语句管理文件等资源，理解上下文管理器在代码块结束后自动释放资源的机制。
  key_points:
  - with open(...) as f 在代码块结束后自动关闭文件
  - 上下文管理器通过 __enter__/__exit__ 管理进入与退出
  - 即使代码块内抛异常，__exit__ 也会被调用
  examples:
  - "with open(\"data.txt\", encoding=\"utf-8\") as f:\n    line = f.readline()"
  common_mistakes:
  - 手动 open 后忘记 close 导致资源泄漏
assessment_ids:
- PY-FILE-02-D1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
status: draft
