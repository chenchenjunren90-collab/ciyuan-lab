id: PY-FILE-02
title: 上下文管理器 with
course: python
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 40
prerequisites:
- PY-FILE-01
learning_objectives:
- 能使用 with 语句安全管理资源
- 能解释 with 自动释放资源的原理
concepts:
- with
- 上下文管理器
- 自动关闭
lesson:
  summary: 使用 with 语句管理文件等资源，理解上下文管理器在代码块结束后自动释放资源的机制。关键要点包括：with 在代码块退出时调用上下文管理协议，异常发生时也能可靠释放资源；打开文本文件时显式指定编码和模式，避免平台默认编码造成不可复现结果；路径、权限和格式错误需要转成面向用户的受控诊断。
  key_points:
  - with 在代码块退出时调用上下文管理协议，异常发生时也能可靠释放资源。
  - 打开文本文件时显式指定编码和模式，避免平台默认编码造成不可复现结果。
  - 路径、权限和格式错误需要转成面向用户的受控诊断。
  examples:
  - '代码示例：with open(path, ''r'', encoding=''utf-8'') as stream: text = stream.read()'
  - 'with open("data.txt") as f: text = f.read()  # 上下文管理器：with 块退出时自动关闭文件'
  common_mistakes:
  - 误以为with 块只有正常退出时才会关闭文件，异常时需要手工 close
  - 误以为同一个已关闭文件对象仍可继续 read，只是速度更慢
  learning_sequence:
  - title: 先建立直觉
    content: 使用 with 语句管理文件等资源，理解上下文管理器在代码块结束后自动释放资源的机制。关键要点包括：with 在代码块退出时调用上下文管理协议，异常发生时也能可靠释放资源；打开文本文件时显式指定编码和模式，避免平台默认编码造成不可复现结果；路径、权限和格式错误需要转成面向用户的受控诊断。
  - title: 跟着示例做
    content: 先运行示例并逐行观察变量变化，再替换一个输入重新预测结果。示例任务：使用 with 自动关闭内存文本流。
  - title: 独立完成课后练习
    content: 完成 PY-FILE-02-H1。第一次只看题面；遇到困难时按顺序打开提示，不直接查看完整答案。
  worked_example:
    problem: 使用 with 自动关闭内存文本流。
    steps:
    - 写清输入、处理和输出三部分。
    - 先完成最小可运行代码，再用一个正常输入验证。
    - 补充边界输入，确认输出格式与预期一致。
    code: "from io import StringIO\nwith StringIO('hello') as file:\n    content = file.read()\nprint(content)\n"
    reflection: with 把获取和释放资源写在同一结构里，减少忘记关闭的问题。
  checkpoint:
    prompt: with 代码块结束时，资源会发生什么？
    guidance: 先用自己的话回答；如果不确定，回到示例逐行运行，再完成随堂检查和课后练习。
