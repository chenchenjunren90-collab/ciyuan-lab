id: PY-DATA-02
title: 综合数据处理
course: python
schema_version: 0.1.0
version: 2
difficulty: advanced
estimated_minutes: 70
prerequisites:
- PY-DATA-01
- PY-FUNC-03
learning_objectives:
- 能综合运用容器与函数处理结构化数据
- 能对处理结果进行统计汇总
concepts:
- 结构化数据
- 统计汇总
- 聚合
- 综合处理
lesson:
  summary: 综合运用容器、函数与文件操作处理结构化数据，并完成统计与汇总。 本节围绕“综合数据处理”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 聚合是对数据做求和、平均、分组等汇总
  - 用函数拆分清洗、统计、输出等职责
  - 字典配合 defaultdict 便于分组累加
  examples:
  - by_cat[cat]["amount"] += qty * price
  common_mistakes:
  - 把清洗与统计逻辑混在一起难以维护
  - 忽略“综合数据处理”的适用前提，直接套用结论或代码模板。
  - 完成“综合数据处理”实现后只检查一个正常样例，没有验证边界和失败路径。
assessment_ids:
- PY-DATA-02-Q1
