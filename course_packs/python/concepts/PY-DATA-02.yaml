id: PY-DATA-02
title: 综合数据处理
course: python
schema_version: 0.1.0
version: 3
difficulty: advanced
estimated_minutes: 70
prerequisites:
- PY-DATA-01
- PY-FUNC-03
learning_objectives:
- 能综合运用容器与函数处理结构化数据
- 能对处理结果进行统计汇总
concepts:
- 结构化数据
- 统计汇总
- 聚合
- 综合处理
lesson:
  summary: 综合运用容器、函数与文件操作处理结构化数据，并完成统计与汇总。关键要点包括：聚合是对数据做求和、平均、分组等汇总；用函数拆分清洗、统计、输出等职责；字典配合 defaultdict 便于分组累加。
  key_points:
  - 聚合是对数据做求和、平均、分组等汇总
  - 用函数拆分清洗、统计、输出等职责
  - 字典配合 defaultdict 便于分组累加
  examples:
  - by_cat[cat]["amount"] += qty * price
  common_mistakes:
  - 误以为聚合前无需验证类型，sum 会自动忽略字符串和 None
  - 误以为分组结果可以直接解释为因果关系，无需说明样本和规则限制
assessment_ids:
- PY-DATA-02-Q1
source_refs:
