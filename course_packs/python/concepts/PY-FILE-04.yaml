id: PY-FILE-04
title: JSON 序列化
course: python
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 45
prerequisites:
- PY-DICT-02
- PY-FILE-02
learning_objectives:
- 能使用 json 模块序列化与反序列化
- 能处理字典与 JSON 的互转
concepts:
- json
- dumps
- loads
- 序列化
lesson:
  summary: 使用 json 模块实现字典与 JSON 字符串的相互转换及文件读写。关键要点包括：json.dumps 把对象序列化为 JSON 字符串；json.loads 把 JSON 字符串解析为对象；json.dump/load
    直接读写文件。
  key_points:
  - json.dumps 把对象序列化为 JSON 字符串
  - json.loads 把 JSON 字符串解析为对象
  - json.dump/load 直接读写文件
  examples:
  - 'json.dumps({"a": 1})'
  - 'json.loads(''{"a": 1}'')  # loads 把 JSON 字符串解析为对象'
  common_mistakes:
  - 误以为JSON 能原样保存任意 Python 对象及其自定义类型
  - 误以为json.loads 接受文件对象并自动从文件读取文本
  learning_sequence:
  - title: 先建立直觉
    content: 使用 json 模块实现字典与 JSON 字符串的相互转换及文件读写。关键要点包括：json.dumps 把对象序列化为 JSON 字符串；json.loads 把 JSON 字符串解析为对象；json.dump/load
      直接读写文件。
  - title: 跟着示例做
    content: 先运行示例并逐行观察变量变化，再替换一个输入重新预测结果。示例任务：把字典序列化为 JSON 文本。
  - title: 独立完成课后练习
    content: 完成 PY-FILE-04-H1。第一次只看题面；遇到困难时按顺序打开提示，不直接查看完整答案。
  worked_example:
    problem: 把字典序列化为 JSON 文本。
    steps:
    - 写清输入、处理和输出三部分。
    - 先完成最小可运行代码，再用一个正常输入验证。
    - 补充边界输入，确认输出格式与预期一致。
    code: 'import json

      data = {''name'': ''小词''}

      print(json.dumps(data, ensure_ascii=False))

      '
    reflection: JSON 是交换格式；不要用 eval 解析外部 JSON 文本。
  checkpoint:
    prompt: JSON 的 true 与 Python 的 True 在解析前后分别属于哪种表示？
    guidance: 先用自己的话回答；如果不确定，回到示例逐行运行，再完成随堂检查和课后练习。
