id: PY-FILE-04
title: JSON 序列化
course: python
schema_version: 0.1.0
version: 2
difficulty: intermediate
estimated_minutes: 45
prerequisites:
- PY-DICT-02
- PY-FILE-02
learning_objectives:
- 能使用 json 模块序列化与反序列化
- 能处理字典与 JSON 的互转
concepts:
- json
- dumps
- loads
- 序列化
lesson:
  summary: 使用 json 模块实现字典与 JSON 字符串的相互转换及文件读写。 本节围绕“JSON 序列化”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - json.dumps 把对象序列化为 JSON 字符串
  - json.loads 把 JSON 字符串解析为对象
  - json.dump/load 直接读写文件
  examples:
  - 'json.dumps({"a": 1})'
  common_mistakes:
  - 把 dumps 与 loads 的方向搞反
  - 忽略“JSON 序列化”的适用前提，直接套用结论或代码模板。
  - 完成“JSON 序列化”实现后只检查一个正常样例，没有验证边界和失败路径。
assessment_ids:
- PY-FILE-04-Q1
source_refs:
