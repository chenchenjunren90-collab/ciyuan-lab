id: PY-FILE-04
title: JSON 序列化
course: python
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 45
prerequisites:
- PY-DICT-02
- PY-FILE-02
learning_objectives:
- 能使用 json 模块序列化与反序列化
- 能处理字典与 JSON 的互转
concepts:
- json
- dumps
- loads
- 序列化
lesson:
  summary: 使用 json 模块实现字典与 JSON 字符串的相互转换及文件读写。关键要点包括：json.dumps 把对象序列化为 JSON 字符串；json.loads 把 JSON 字符串解析为对象；json.dump/load
    直接读写文件。
  key_points:
  - json.dumps 把对象序列化为 JSON 字符串
  - json.loads 把 JSON 字符串解析为对象
  - json.dump/load 直接读写文件
  examples:
  - 'json.dumps({"a": 1})'
  common_mistakes:
  - 误以为JSON 能原样保存任意 Python 对象及其自定义类型
  - 误以为json.loads 接受文件对象并自动从文件读取文本
assessment_ids:
- PY-FILE-04-Q1
source_refs:
