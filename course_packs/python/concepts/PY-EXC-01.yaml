id: PY-EXC-01
title: 异常处理
course: python
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 50
prerequisites:
- PY-BASE-10
learning_objectives:
- 能使用 try/except 捕获异常
- 能使用 finally 执行收尾操作
concepts:
- try
- except
- finally
- 异常类型
lesson:
  summary: 使用 try/except 捕获并处理异常，理解 finally 的收尾语义与常见异常类型。关键要点包括：try 只包围可能失败的最小操作，except 捕获能够处理的具体异常类型；else 用于没有异常时的后续逻辑，finally
    用于无论成功失败都必须执行的清理；异常信息应保留输入位置和操作上下文，但不得泄露密钥或学生敏感数据。
  key_points:
  - try 只包围可能失败的最小操作，except 捕获能够处理的具体异常类型。
  - else 用于没有异常时的后续逻辑，finally 用于无论成功失败都必须执行的清理。
  - 异常信息应保留输入位置和操作上下文，但不得泄露密钥或学生敏感数据。
  examples:
  - '代码示例：try: value = int(text)

    except ValueError: value = None'
  common_mistakes:
  - 误以为except Exception 能捕获包括 KeyboardInterrupt 在内的所有 BaseException
  - 误以为finally 只在没有异常时执行，出现异常后会被跳过
