id: PY-FILE-01
title: 文件读写基础
course: python
schema_version: 0.1.0
version: 1
difficulty: beginner
estimated_minutes: 45
prerequisites:
- PY-STR-03
learning_objectives:
- 能使用 open 打开文件
- 能进行文本文件的读取与写入
concepts:
- open
- read
- write
- 读写模式
lesson:
  summary: 使用 open 打开文件，掌握文本文件的读取与写入以及读写模式的区别。
  key_points:
  - open() 默认只读模式 r，写入用 w 或 a
  - read() 读取全部内容，write() 写入字符串
  - w 会覆盖原文件，a 在末尾追加
  examples:
  - f = open("data.txt", "r", encoding="utf-8")
  common_mistakes:
  - 写入时忘记用 w/a 模式导致文件不可写
assessment_ids:
- PY-FILE-01-Q1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
status: draft
