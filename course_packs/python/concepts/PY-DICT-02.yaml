id: PY-DICT-02
title: 字典遍历与常用方法
course: python
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 45
prerequisites:
- PY-DICT-01
learning_objectives:
- 能遍历字典的键、值与键值对
- 能使用 items/keys/values 方法
concepts:
- items
- keys
- values
- 遍历
lesson:
  summary: 掌握字典的遍历方式与 items/keys/values 方法，能够按需遍历键值对。关键要点包括：keys() 返回键，values() 返回值，items() 返回键值对；for k, v in d.items() 同时遍历键和值；Python
    3.7+ 字典保持插入顺序。
  key_points:
  - keys() 返回键，values() 返回值，items() 返回键值对
  - for k, v in d.items() 同时遍历键和值
  - Python 3.7+ 字典保持插入顺序
  examples:
  - 'for word, cnt in counts.items(): print(word, cnt)'
  common_mistakes:
  - 误以为遍历字典时可以任意增删键而不会影响迭代器
  - 误以为dict.update 只添加新键，遇到已有键时不会覆盖原值
assessment_ids:
- PY-DICT-02-C1
source_refs:
