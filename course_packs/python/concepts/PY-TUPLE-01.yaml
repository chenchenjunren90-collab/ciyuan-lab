id: PY-TUPLE-01
title: 元组
course: python
schema_version: 0.1.0
version: 2
difficulty: beginner
estimated_minutes: 30
prerequisites:
- PY-LIST-01
learning_objectives:
- 能创建与访问元组
- 能解释元组与列表的不可变区别
concepts:
- 元组
- 不可变
- 打包
- 解包
lesson:
  summary: 掌握元组的创建与访问，理解其不可变性，并学会元组打包与解包。 本节围绕“元组”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 元组用圆括号 () 创建，一旦创建不可修改
  - 元组支持索引与切片，但不支持增删改
  - 多个值逗号分隔可打包成元组，也可解包赋值
  examples:
  - t = (1, 2, 3)；a, b, c = t
  common_mistakes:
  - 尝试对元组调用 append 等修改方法
  - 忽略“元组”的适用前提，直接套用结论或代码模板。
  - 完成“元组”实现后只检查一个正常样例，没有验证边界和失败路径。
assessment_ids:
- PY-TUPLE-01-Q1
source_refs:
