id: PY-BASE-05
title: 条件语句
course: python
schema_version: 0.1.0
version: 1
difficulty: beginner
estimated_minutes: 50
prerequisites:
- PY-BASE-03
learning_objectives:
- 能使用 if/elif/else 实现分支逻辑
- 能构造多分支与嵌套判断
concepts:
- if
- elif
- else
- 嵌套
- 布尔表达式
lesson:
  summary: 使用 if/elif/else 根据条件选择执行路径，理解缩进对代码块的作用，并能构造多分支与嵌套判断。
  key_points:
  - if 条件为真执行对应代码块，elif 处理后续分支，else 兜底
  - Python 用缩进划分代码块，同一代码块缩进必须一致
  - 多分支判断应从高到低依次判断边界条件
  examples:
  - 'if score >= 90: ... elif score >= 60: ...'
  common_mistakes:
  - 判断顺序混乱导致边界值落入错误分支
assessment_ids:
- PY-BASE-05-C1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
status: draft
