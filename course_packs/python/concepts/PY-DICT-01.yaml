id: PY-DICT-01
title: 字典基础
course: python
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 40
prerequisites:
- PY-BASE-07
learning_objectives:
- 能创建字典并按键访问值
- 能进行增删改查操作
concepts:
- 字典
- 键值对
- 键唯一
- get
lesson:
  summary: 掌握字典的创建、按键访问、增删改查，理解键的唯一性与 get 方法的容错用法。关键要点包括：字典把可散列且相等语义稳定的键映射到值，键在一个字典中唯一；使用 get、in 或 setdefault
    明确缺失键策略，不应无条件索引未知外部键；遍历 items 可同时获得键和值，插入顺序不等于业务排序规则。
  key_points:
  - 字典把可散列且相等语义稳定的键映射到值，键在一个字典中唯一。
  - 使用 get、in 或 setdefault 明确缺失键策略，不应无条件索引未知外部键。
  - 遍历 items 可同时获得键和值，插入顺序不等于业务排序规则。
  examples:
  - 代码示例：counts = {}; counts[word] = counts.get(word, 0) + 1
  - "键值对：student = {'name': 'Alice', 'age': 18}  # 每个元素是一个键值对"
  - "键唯一：d = {'a': 1}; d['a'] = 2  # 键唯一，重复赋值覆盖旧值"
  common_mistakes:
  - 误以为字典允许把列表直接作为键，因为列表内容可以比较
  - 误以为访问不存在的键时 dict[key] 与 dict.get(key) 都返回 None
  learning_sequence:
  - title: 建立键到值的映射
    content: 先用少量键值对区分“按位置访问”和“按键访问”，理解键唯一。
  - title: 明确缺失键策略
    content: 比较方括号、in 与 get 的行为，并根据业务要求选择报错、默认值或跳过。
  - title: 完成统计模式
    content: 用 get(key, 0) 累加，再按 sorted(counts) 输出稳定、可测试的结果。
  worked_example:
    problem: 统计标签列表中每个标签出现次数，并按标签字典序输出。
    steps:
    - 创建空字典 counts 保存标签与次数。
    - 遍历标签，用 get(label, 0) 读取旧值后加一。
    - 遍历排序后的键，输出键和对应次数。
    code: "labels = [\"beta\", \"alpha\", \"beta\"]\ncounts = {}\nfor label in labels:\n    counts[label]\
      \ = counts.get(label, 0) + 1\nfor label in sorted(counts):\n    print(label, counts[label])\n"
    reflection: 字典保留插入顺序，但题目要求的业务顺序必须显式实现，不能把插入顺序误当排序规则。
  checkpoint:
    prompt: 当键可能不存在时，counts[key]、counts.get(key) 和 counts.get(key, 0) 的结果有何不同？
    guidance: 分别在空字典上运行三种写法，记录返回值或异常类型，再说明哪种适合计数。
