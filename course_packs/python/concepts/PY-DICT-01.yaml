id: PY-DICT-01
title: 字典基础
course: python
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 40
prerequisites:
- PY-BASE-07
learning_objectives:
- 能创建字典并按键访问值
- 能进行增删改查操作
concepts:
- 字典
- 键值对
- 键唯一
- get
lesson:
  summary: 掌握字典的创建、按键访问、增删改查，理解键的唯一性与 get 方法的容错用法。关键要点包括：字典把可散列且相等语义稳定的键映射到值，键在一个字典中唯一；使用 get、in 或 setdefault 明确缺失键策略，不应无条件索引未知外部键；遍历
    items 可同时获得键和值，插入顺序不等于业务排序规则。
  key_points:
  - 字典把可散列且相等语义稳定的键映射到值，键在一个字典中唯一。
  - 使用 get、in 或 setdefault 明确缺失键策略，不应无条件索引未知外部键。
  - 遍历 items 可同时获得键和值，插入顺序不等于业务排序规则。
  examples:
  - 代码示例：counts = {}; counts[word] = counts.get(word, 0) + 1
  common_mistakes:
  - 误以为字典允许把列表直接作为键，因为列表内容可以比较
  - 误以为访问不存在的键时 dict[key] 与 dict.get(key) 都返回 None
assessment_ids:
- PY-DICT-01-Q1
