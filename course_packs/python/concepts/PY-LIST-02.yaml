id: PY-LIST-02
title: 列表常用方法
course: python
schema_version: 0.1.0
version: 2
difficulty: beginner
estimated_minutes: 45
prerequisites:
- PY-LIST-01
learning_objectives:
- 能使用 append/insert/remove/pop 修改列表
- 能使用 sort/reverse 排序列表
concepts:
- append
- insert
- remove
- pop
- sort
lesson:
  summary: 掌握列表的增删改查方法（append、insert、remove、pop、sort 等）及其返回值。 本节围绕“列表常用方法”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - append(x) 在末尾追加，insert(i, x) 在指定位置插入
  - remove(x) 删除首个匹配值，pop() 删除并返回末尾元素
  - sort() 原地排序，注意它返回 None
  examples:
  - lst.append(4) 在末尾添加 4
  common_mistakes:
  - 误用 sort() 的返回值当作排序后的列表
  - 忽略“列表常用方法”的适用前提，直接套用结论或代码模板。
  - 完成“列表常用方法”实现后只检查一个正常样例，没有验证边界和失败路径。
assessment_ids:
- PY-LIST-02-Q1
source_refs:
