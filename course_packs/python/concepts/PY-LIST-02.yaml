id: PY-LIST-02
title: 列表常用方法
course: python
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 45
prerequisites:
- PY-LIST-01
learning_objectives:
- 能使用 append/insert/remove/pop 修改列表
- 能使用 sort/reverse 排序列表
concepts:
- append
- insert
- remove
- pop
- sort
lesson:
  summary: 掌握列表的增删改查方法（append、insert、remove、pop、sort 等）及其返回值。关键要点包括：append(x) 在末尾追加，insert(i, x) 在指定位置插入；remove(x) 删除首个匹配值，pop()
    删除并返回末尾元素；sort() 原地排序，注意它返回 None。
  key_points:
  - append(x) 在末尾追加，insert(i, x) 在指定位置插入
  - remove(x) 删除首个匹配值，pop() 删除并返回末尾元素
  - sort() 原地排序，注意它返回 None
  examples:
  - lst.append(4) 在末尾添加 4
  common_mistakes:
  - 误以为list.sort 会返回排序后的新列表，原列表保持不变
  - 误以为remove(x) 会删除列表中所有等于 x 的元素
assessment_ids:
- PY-LIST-02-Q1
