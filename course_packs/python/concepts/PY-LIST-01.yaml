id: PY-LIST-01
title: 列表创建与访问
course: python
schema_version: 0.1.0
version: 2
difficulty: beginner
estimated_minutes: 40
prerequisites:
- PY-BASE-02
learning_objectives:
- 能创建列表并访问元素
- 能对列表进行索引与切片
concepts:
- 列表
- 索引
- 切片
- 可变性
lesson:
  summary: 掌握列表的创建、索引访问、切片以及列表可变的基本特性。
  key_points:
  - 列表用方括号 [] 创建，元素可为任意类型
  - 列表索引从 0 开始，支持负索引与切片
  - 列表可变，可原地修改元素
  examples:
  - lst = [10, 20, 30]；lst[0] 为 10
  common_mistakes:
  - 索引越界访问导致 IndexError
assessment_ids:
- PY-LIST-01-Q1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
status: draft
