id: PY-LIST-01
title: 列表创建与访问
course: python
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 40
prerequisites:
- PY-BASE-02
learning_objectives:
- 能创建列表并访问元素
- 能对列表进行索引与切片
concepts:
- 列表
- 索引
- 切片
- 可变性
lesson:
  summary: 掌握列表的创建、索引访问、切片以及列表可变的基本特性。关键要点包括：列表是有序、可变容器，索引范围为 -len(items) 到 len(items)-1；切片创建浅拷贝并使用半开区间，嵌套可变对象仍然可能被多个列表共享；空列表访问、越界和别名修改必须通过接口约定与测试显式处理。
  key_points:
  - 列表是有序、可变容器，索引范围为 -len(items) 到 len(items)-1。
  - 切片创建浅拷贝并使用半开区间，嵌套可变对象仍然可能被多个列表共享。
  - 空列表访问、越界和别名修改必须通过接口约定与测试显式处理。
  examples:
  - 代码示例：values = [3, 1, 4]; first, tail = values[0], values[1:]
  common_mistakes:
  - 误以为访问列表下标 len(items) 会得到最后一个元素
  - 误以为列表赋值 copy = original 会创建元素完全独立的副本
