id: PY-LIST-01
title: 列表创建与访问
course: python
schema_version: 0.1.0
version: 2
difficulty: beginner
estimated_minutes: 40
prerequisites:
- PY-BASE-02
learning_objectives:
- 能创建列表并访问元素
- 能对列表进行索引与切片
concepts:
- 列表
- 索引
- 切片
- 可变性
lesson:
  summary: 掌握列表的创建、索引访问、切片以及列表可变的基本特性。 本节围绕“列表创建与访问”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 列表是有序、可变容器，索引范围为 -len(items) 到 len(items)-1。
  - 切片创建浅拷贝并使用半开区间，嵌套可变对象仍然可能被多个列表共享。
  - 空列表访问、越界和别名修改必须通过接口约定与测试显式处理。
  examples:
  - 代码示例：values = [3, 1, 4]; first, tail = values[0], values[1:]
  common_mistakes:
  - 用 [[0] * 3] * 3 创建二维列表，导致三行引用同一个内部列表。
  - 在列表为空时直接读取 items[0]。
assessment_ids:
