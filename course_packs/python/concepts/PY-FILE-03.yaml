id: PY-FILE-03
title: CSV 文件处理
course: python
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 55
prerequisites:
- PY-FILE-02
- PY-LIST-02
learning_objectives:
- 能使用 csv 模块读写 CSV 数据
- 能按行处理表格数据
concepts:
- csv
- reader
- writer
- DictReader
lesson:
  summary: 使用 csv 模块读写表格数据，掌握 reader/writer 与 DictReader 的用法。关键要点包括：csv.reader 按行读取，每行是字段列表；csv.DictReader 以表头为键，每行是字典；csv
    模块正确处理逗号、引号等分隔细节。
  key_points:
  - csv.reader 按行读取，每行是字段列表
  - csv.DictReader 以表头为键，每行是字典
  - csv 模块正确处理逗号、引号等分隔细节
  examples:
  - csv.DictReader(f) 读取带表头的 CSV
  common_mistakes:
  - 误以为CSV 字段可以始终用逗号 split，引用字段和换行不会造成差异
  - 误以为csv.reader 会自动把数字字段转换为 int 或 float
assessment_ids:
- PY-FILE-03-C1
source_refs:
