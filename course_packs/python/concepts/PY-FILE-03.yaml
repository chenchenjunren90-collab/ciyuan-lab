id: PY-FILE-03
title: CSV 文件处理
course: python
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 55
prerequisites:
- PY-FILE-02
- PY-LIST-02
learning_objectives:
- 能使用 csv 模块读写 CSV 数据
- 能按行处理表格数据
concepts:
- csv
- reader
- writer
- DictReader
lesson:
  summary: 使用 csv 模块读写表格数据，掌握 reader/writer 与 DictReader 的用法。关键要点包括：csv.reader 按行读取，每行是字段列表；csv.DictReader
    以表头为键，每行是字典；csv 模块正确处理逗号、引号等分隔细节。
  key_points:
  - csv.reader 按行读取，每行是字段列表
  - csv.DictReader 以表头为键，每行是字典
  - csv 模块正确处理逗号、引号等分隔细节
  examples:
  - csv.DictReader(f) 读取带表头的 CSV
  - 'csv.writer(f).writerow(["name", "score"])  # writer 写入一行字段'
  common_mistakes:
  - 误以为CSV 字段可以始终用逗号 split，引用字段和换行不会造成差异
  - 误以为csv.reader 会自动把数字字段转换为 int 或 float
  learning_sequence:
  - title: 先建立直觉
    content: 使用 csv 模块读写表格数据，掌握 reader/writer 与 DictReader 的用法。关键要点包括：csv.reader 按行读取，每行是字段列表；csv.DictReader
      以表头为键，每行是字典；csv 模块正确处理逗号、引号等分隔细节。
  - title: 跟着示例做
    content: 先运行示例并逐行观察变量变化，再替换一个输入重新预测结果。示例任务：用 csv.reader 解析一行带逗号的数据。
  - title: 独立完成课后练习
    content: 完成 PY-FILE-03-H1。第一次只看题面；遇到困难时按顺序打开提示，不直接查看完整答案。
  worked_example:
    problem: 用 csv.reader 解析一行带逗号的数据。
    steps:
    - 写清输入、处理和输出三部分。
    - 先完成最小可运行代码，再用一个正常输入验证。
    - 补充边界输入，确认输出格式与预期一致。
    code: 'import csv

      from io import StringIO

      row = next(csv.reader(StringIO(''A,90'')))

      print(row)

      '
    reflection: 结构化文件应优先使用标准解析器，而不是手写脆弱的分隔规则。
  checkpoint:
    prompt: 为什么 CSV 中含引号和逗号时不宜简单使用 split(',')？
    guidance: 先用自己的话回答；如果不确定，回到示例逐行运行，再完成随堂检查和课后练习。
