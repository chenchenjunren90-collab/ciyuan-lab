id: PY-BASE-02
title: 变量与基本数据类型
course: python
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 40
prerequisites:
- PY-BASE-01
learning_objectives:
- 能声明变量并赋值
- 能区分整型、浮点型、字符串与布尔型
concepts:
- 变量
- int
- float
- str
- bool
lesson:
  summary: 学习变量的命名与赋值规则，认识整数、浮点数、字符串与布尔值等基本数据类型及其相互区别。关键要点包括：Python 名称绑定对象，赋值不会声明固定类型；对象类型决定可执行的操作；int、float、str、bool 的转换需要明确输入约定，失败时应处理
    ValueError；使用 type 和 isinstance 观察类型，但程序接口更应通过行为和测试表达约束。
  key_points:
  - Python 名称绑定对象，赋值不会声明固定类型；对象类型决定可执行的操作。
  - int、float、str、bool 的转换需要明确输入约定，失败时应处理 ValueError。
  - 使用 type 和 isinstance 观察类型，但程序接口更应通过行为和测试表达约束。
  examples:
  - 代码示例：age_text = '20'; age = int(age_text); is_adult = age >= 18
  common_mistakes:
  - 误以为变量保存的是不可改变的固定类型存储槽，重新赋值不能绑定其他类型对象
  - 误以为is 与 == 始终等价，都只比较两个对象的值
assessment_ids:
