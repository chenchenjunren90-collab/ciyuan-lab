id: PY-BASE-02
title: 变量与基本数据类型
course: python
schema_version: 0.1.0
version: 2
difficulty: beginner
estimated_minutes: 40
prerequisites:
- PY-BASE-01
learning_objectives:
- 能声明变量并赋值
- 能区分整型、浮点型、字符串与布尔型
concepts:
- 变量
- int
- float
- str
- bool
lesson:
  summary: 学习变量的命名与赋值规则，认识整数、浮点数、字符串与布尔值等基本数据类型及其相互区别。 本节围绕“变量与基本数据类型”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - Python 名称绑定对象，赋值不会声明固定类型；对象类型决定可执行的操作。
  - int、float、str、bool 的转换需要明确输入约定，失败时应处理 ValueError。
  - 使用 type 和 isinstance 观察类型，但程序接口更应通过行为和测试表达约束。
  examples:
  - 代码示例：age_text = '20'; age = int(age_text); is_adult = age >= 18
  common_mistakes:
  - 把 input 返回值当作整数直接相加。
  - 用变量名 str、list 覆盖内置类型，导致后续调用失败。
assessment_ids:
- PY-BASE-02-Q1
