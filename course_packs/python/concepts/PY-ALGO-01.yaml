id: PY-ALGO-01
title: 排序与查找
course: python
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 50
prerequisites:
- PY-LIST-02
- PY-BASE-05
learning_objectives:
- 能使用内置与自定义方式排序
- 能解释线性查找与二分查找的适用条件与复杂度差异
concepts:
- 排序
- sorted
- 线性查找
- 二分查找
lesson:
  summary: 掌握 sorted 与自定义排序，理解线性查找与二分查找的适用条件与复杂度。关键要点包括：选择排序或查找方法前先确认输入是否有序、是否需要稳定性以及数据规模；Python 的 sorted
    返回新列表，list.sort 原地修改；key 函数只描述排序键；二分查找必须维护半开或闭区间不变量，并明确重复元素时返回哪一个位置。
  key_points:
  - 选择排序或查找方法前先确认输入是否有序、是否需要稳定性以及数据规模。
  - Python 的 sorted 返回新列表，list.sort 原地修改；key 函数只描述排序键。
  - 二分查找必须维护半开或闭区间不变量，并明确重复元素时返回哪一个位置。
  examples:
  - '代码示例：ordered = sorted(records, key=lambda item: (item[''score''], item[''id'']))'
  - 'nums = [3, 1, 2]; nums.sort()  # 排序：list.sort 原地修改列表'
  - 'nums = [1, 2, 3]; i = nums.index(2)  # 线性查找：从头逐个比较元素直到命中'
  common_mistakes:
  - 误以为只看代码行数就能确定时间复杂度，无需定义输入规模
  - 误以为两个同为 O(n) 的程序在所有数据规模上运行时间都相同
  learning_sequence:
  - title: 先建立直觉
    content: 掌握 sorted 与自定义排序，理解线性查找与二分查找的适用条件与复杂度。关键要点包括：选择排序或查找方法前先确认输入是否有序、是否需要稳定性以及数据规模；Python 的 sorted
      返回新列表，list.sort 原地修改；key 函数只描述排序键；二分查找必须维护半开或闭区间不变量，并明确重复元素时返回哪一个位置。
  - title: 跟着示例做
    content: 先运行示例并逐行观察变量变化，再替换一个输入重新预测结果。示例任务：比较中间元素后排除一半区间。
  - title: 独立完成课后练习
    content: 完成 PY-ALGO-01-H1。第一次只看题面；遇到困难时按顺序打开提示，不直接查看完整答案。
  worked_example:
    problem: 比较中间元素后排除一半区间。
    steps:
    - 写清输入、处理和输出三部分。
    - 先完成最小可运行代码，再用一个正常输入验证。
    - 补充边界输入，确认输出格式与预期一致。
    code: 'numbers = [1, 3, 5]

      mid = (0 + len(numbers) - 1) // 2

      print(numbers[mid])

      '
    reflection: 二分查找重点是区间含义和边界不变量，不是背代码。
  checkpoint:
    prompt: 为什么更新边界时需要加一或减一？
    guidance: 先用自己的话回答；如果不确定，回到示例逐行运行，再完成随堂检查和课后练习。
