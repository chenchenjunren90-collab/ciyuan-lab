id: PY-ALGO-01
title: 排序与查找
course: python
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 50
prerequisites:
- PY-LIST-02
- PY-BASE-05
learning_objectives:
- 能使用内置与自定义方式排序
- 能解释线性查找与二分查找的适用条件与复杂度差异
concepts:
- 排序
- sorted
- 线性查找
- 二分查找
lesson:
  summary: 掌握 sorted 与自定义排序，理解线性查找与二分查找的适用条件与复杂度。关键要点包括：选择排序或查找方法前先确认输入是否有序、是否需要稳定性以及数据规模；Python 的 sorted 返回新列表，list.sort
    原地修改；key 函数只描述排序键；二分查找必须维护半开或闭区间不变量，并明确重复元素时返回哪一个位置。
  key_points:
  - 选择排序或查找方法前先确认输入是否有序、是否需要稳定性以及数据规模。
  - Python 的 sorted 返回新列表，list.sort 原地修改；key 函数只描述排序键。
  - 二分查找必须维护半开或闭区间不变量，并明确重复元素时返回哪一个位置。
  examples:
  - '代码示例：ordered = sorted(records, key=lambda item: (item[''score''], item[''id'']))'
  common_mistakes:
  - 误以为只看代码行数就能确定时间复杂度，无需定义输入规模
  - 误以为两个同为 O(n) 的程序在所有数据规模上运行时间都相同
