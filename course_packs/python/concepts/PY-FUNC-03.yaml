id: PY-FUNC-03
title: 可变参数
course: python
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 40
prerequisites:
- PY-FUNC-02
learning_objectives:
- 能使用 *args 接收任意数量位置参数
- 能使用 **kwargs 接收关键字参数
concepts:
- '*args'
- '**kwargs'
- 参数解包
lesson:
  summary: 使用 *args 与 **kwargs 接收可变数量的参数，理解参数解包的用法。关键要点包括：*args 把任意数量位置参数打包为元组；**kwargs 把关键字参数打包为字典；* 也用于把可迭代对象解包为独立实参。
  key_points:
  - '*args 把任意数量位置参数打包为元组'
  - '**kwargs 把关键字参数打包为字典'
  - '* 也用于把可迭代对象解包为独立实参'
  examples:
  - 'def f(*args): return sum(args)'
  common_mistakes:
  - 误以为*args 是列表，**kwargs 的键可以不是字符串
  - 误以为可变默认参数会在每次函数调用时重新创建
assessment_ids:
- PY-FUNC-03-Q1
source_refs:
