id: PY-FUNC-03
title: 可变参数
course: python
schema_version: 0.1.0
version: 2
difficulty: intermediate
estimated_minutes: 40
prerequisites:
- PY-FUNC-02
learning_objectives:
- 能使用 *args 接收任意数量位置参数
- 能使用 **kwargs 接收关键字参数
concepts:
- '*args'
- '**kwargs'
- 参数解包
lesson:
  summary: 使用 *args 与 **kwargs 接收可变数量的参数，理解参数解包的用法。 本节围绕“可变参数”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - '*args 把任意数量位置参数打包为元组'
  - '**kwargs 把关键字参数打包为字典'
  - '* 也用于把可迭代对象解包为独立实参'
  examples:
  - 'def f(*args): return sum(args)'
  common_mistakes:
  - 混淆 *args（位置）与 **kwargs（关键字）
  - 忽略“可变参数”的适用前提，直接套用结论或代码模板。
  - 完成“可变参数”实现后只检查一个正常样例，没有验证边界和失败路径。
assessment_ids:
- PY-FUNC-03-Q1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
- SRC-PY-GUIDE-FUNCTIONS
status: draft
