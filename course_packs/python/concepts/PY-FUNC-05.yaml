id: PY-FUNC-05
title: lambda 与高阶函数
course: python
schema_version: 0.1.0
version: 1
difficulty: intermediate
estimated_minutes: 45
prerequisites:
- PY-FUNC-01
- PY-LIST-01
learning_objectives:
- 能使用 lambda 定义匿名函数
- 能使用 map/filter 处理序列
concepts:
- lambda
- map
- filter
- 高阶函数
lesson:
  summary: 使用 lambda 定义简单匿名函数，掌握 map、filter 等高阶函数的用法。
  key_points:
  - lambda 用于定义简单的匿名函数，无需 def
  - map(f, seq) 对每个元素应用 f
  - filter(f, seq) 保留使 f 为真的元素
  examples:
  - 'map(lambda x: x * x, [1, 2, 3])'
  common_mistakes:
  - 把 map/filter 的结果当作列表，需 list() 转换
assessment_ids:
- PY-FUNC-05-Q1
