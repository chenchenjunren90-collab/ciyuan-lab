id: PY-MOD-02
title: 常用标准库
course: python
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 45
prerequisites:
- PY-MOD-01
learning_objectives:
- 能使用 math/random 处理数学与随机需求
- 能使用 datetime 处理日期时间
concepts:
- math
- random
- datetime
- 标准库
lesson:
  summary: 熟悉 math、random、datetime 等常用标准库的典型用法。关键要点包括：math 提供数学函数，如 sqrt、floor；random.randint(a, b) 生成 [a, b] 内的随机整数；datetime
    处理日期时间对象。
  key_points:
  - math 提供数学函数，如 sqrt、floor
  - random.randint(a, b) 生成 [a, b] 内的随机整数
  - datetime 处理日期时间对象
  examples:
  - random.randint(1, 10)
  common_mistakes:
  - 误以为random 模块生成的伪随机值适合直接用于密码和令牌
  - 误以为标准库函数的参数、返回值和异常在所有 Python 版本中都不会变化
assessment_ids:
- PY-MOD-02-Q1
