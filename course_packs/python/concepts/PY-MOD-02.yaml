id: PY-MOD-02
title: 常用标准库
course: python
schema_version: 0.1.0
version: 1
difficulty: intermediate
estimated_minutes: 45
prerequisites:
- PY-MOD-01
learning_objectives:
- 能使用 math/random 处理数学与随机需求
- 能使用 datetime 处理日期时间
concepts:
- math
- random
- datetime
- 标准库
lesson:
  summary: 熟悉 math、random、datetime 等常用标准库的典型用法。
  key_points:
  - math 提供数学函数，如 sqrt、floor
  - random.randint(a, b) 生成 [a, b] 内的随机整数
  - datetime 处理日期时间对象
  examples:
  - random.randint(1, 10)
  common_mistakes:
  - 把 math 与 random 的函数混用
assessment_ids:
- PY-MOD-02-Q1
