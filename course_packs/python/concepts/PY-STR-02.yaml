id: PY-STR-02
title: 字符串索引与切片
course: python
schema_version: 0.1.0
version: 1
difficulty: beginner
estimated_minutes: 45
prerequisites:
- PY-STR-01
learning_objectives:
- 能通过索引访问单个字符
- 能使用切片提取子串
concepts:
- 索引
- 切片
- 负索引
- 步长
lesson:
  summary: 掌握字符串索引（含负索引）与切片操作，理解切片起止与步长的含义。
  key_points:
  - 索引从 0 开始，负索引从末尾倒着数
  - 切片 s[start:end] 为左闭右开区间
  - 切片支持步长 s[start:end:step]
  examples:
  - s = "hello"；s[1:3] 为 "el"
  common_mistakes:
  - 以为切片包含右端点
assessment_ids:
- PY-STR-02-Q1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
status: draft
