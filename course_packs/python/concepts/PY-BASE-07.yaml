id: PY-BASE-07
title: for 循环与 range
course: python
schema_version: 0.1.0
version: 2
difficulty: beginner
estimated_minutes: 45
prerequisites:
- PY-BASE-02
learning_objectives:
- 能使用 for 遍历序列
- 能使用 range 生成整数序列
concepts:
- for
- range
- 遍历
- 步长
lesson:
  summary: 使用 for 循环遍历序列，借助 range 生成指定范围的整数序列，理解 range 的起止与步长参数。 本节围绕“for 循环与 range”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - for 直接遍历可迭代对象；range(start, stop, step) 不包含 stop。
  - 需要索引时使用 enumerate，需要并行遍历时使用 zip，而不是手工维护多个下标。
  - 循环前明确空输入、步长方向和聚合初值，循环后验证边界结果。
  examples:
  - 代码示例：total = sum(value for value in range(1, n + 1))
  common_mistakes:
  - 认为 range(1, n) 会包含 n，产生少一次循环。
  - 遍历列表时同时删除元素，造成元素被跳过。
assessment_ids:
