id: PY-BASE-07
title: for 循环与 range
course: python
schema_version: 0.1.0
version: 1
difficulty: beginner
estimated_minutes: 45
prerequisites:
- PY-BASE-06
learning_objectives:
- 能使用 for 遍历序列
- 能使用 range 生成整数序列
concepts:
- for
- range
- 遍历
- 步长
lesson:
  summary: 使用 for 循环遍历序列，借助 range 生成指定范围的整数序列，理解 range 的起止与步长参数。
  key_points:
  - for x in 序列 依次取出每个元素
  - range(start, stop, step) 生成左闭右开的整数序列
  - range(n) 表示 0 到 n-1
  examples:
  - 'for i in range(1, 6): print(i)  # 1 到 5'
  common_mistakes:
  - 误以为 range(1, n) 包含右端点 n
assessment_ids:
- PY-BASE-07-C1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
