id: PY-FUNC-04
title: 作用域
course: python
schema_version: 0.1.0
version: 1
difficulty: intermediate
estimated_minutes: 40
prerequisites:
- PY-FUNC-01
learning_objectives:
- 能区分局部变量与全局变量
- 能使用 global/nonlocal 修改外层变量
concepts:
- 作用域
- 局部变量
- 全局变量
- global
lesson:
  summary: 理解局部与全局作用域，掌握 global 与 nonlocal 的适用场景。
  key_points:
  - 函数内赋值的变量默认为局部变量
  - 函数内只读访问全局变量无需声明
  - 函数内修改全局变量需先 global 声明
  examples:
  - "def f():\n    global x\n    x = 1"
  common_mistakes:
  - 在函数内给全局变量赋值却忘了 global 声明
assessment_ids:
- PY-FUNC-04-Q1
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-TUTORIAL
status: draft
