id: PY-BASE-09
title: 类型转换与常用内置函数
course: python
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 35
prerequisites:
- PY-BASE-02
learning_objectives:
- 能使用 int/str/float 进行类型转换
- 能使用 len/type/abs/round 等常用内置函数
concepts:
- 类型转换
- int
- str
- len
- type
lesson:
  summary: 掌握常见类型转换函数与常用内置函数（len、type、abs、round 等）的用法。关键要点包括：int()/float()/str() 用于类型之间的转换；len() 求长度，type() 查看类型，abs() 求绝对值；round()
    对精确的中间值采用“最接近且偶数优先”的规则；二进制浮点表示还可能影响直觉结果。
  key_points:
  - int()/float()/str() 用于类型之间的转换
  - len() 求长度，type() 查看类型，abs() 求绝对值
  - round() 对精确的中间值采用“最接近且偶数优先”的规则；二进制浮点表示还可能影响直觉结果
  examples:
  - 代码示例：int('42') 得到整数 42，str(3.5) 得到字符串 '3.5'；int('3.5') 会抛出 ValueError。
  common_mistakes:
  - 误以为int('3.5') 会自动先转成浮点数再得到整数 3
  - 误以为input 会根据输入内容自动返回 int 或 float
