id: PY-BASE-09
title: 类型转换与常用内置函数
course: python
schema_version: 0.1.0
version: 1
difficulty: beginner
estimated_minutes: 35
prerequisites:
- PY-BASE-02
learning_objectives:
- 能使用 int/str/float 进行类型转换
- 能使用 len/type/abs/round 等常用内置函数
concepts:
- 类型转换
- int
- str
- len
- type
lesson:
  summary: 掌握常见类型转换函数与常用内置函数（len、type、abs、round 等）的用法。
  key_points:
  - int()/float()/str() 用于类型之间的转换
  - len() 求长度，type() 查看类型，abs() 求绝对值
  - round() 按四舍五入保留指定位数
  examples:
  - int("42") 的结果为整数 42
  common_mistakes:
  - 对无法转换的字符串直接调用 int() 导致 ValueError
assessment_ids:
- PY-BASE-09-Q1
