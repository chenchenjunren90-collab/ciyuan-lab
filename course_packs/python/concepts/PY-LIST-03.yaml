id: PY-LIST-03
title: 列表推导式
course: python
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 45
prerequisites:
- PY-LIST-01
- PY-BASE-07
learning_objectives:
- 能用列表推导式生成列表
- 能写出带条件过滤的列表推导式
concepts:
- 列表推导式
- 条件过滤
- 简洁语法
lesson:
  summary: 使用列表推导式以简洁语法构造列表，掌握带条件过滤的写法。关键要点包括：语法为 [表达式 for 变量 in 序列 if 条件]；if 条件用于过滤，表达式作用于满足条件的元素；可读性优先，复杂逻辑仍建议用普通循环。
  key_points:
  - 语法为 [表达式 for 变量 in 序列 if 条件]
  - if 条件用于过滤，表达式作用于满足条件的元素
  - 可读性优先，复杂逻辑仍建议用普通循环
  examples:
  - '[x * x for x in nums if x > 0]'
  common_mistakes:
  - 误以为列表推导式的过滤条件写在表达式之前
  - 误以为嵌套列表推导式中交换两个 for 的顺序不会改变结果顺序或含义
assessment_ids:
- PY-LIST-03-C1
source_refs:
