id: PY-LIST-03
title: 列表推导式
course: python
schema_version: 0.1.0
version: 2
difficulty: intermediate
estimated_minutes: 45
prerequisites:
- PY-LIST-01
- PY-BASE-07
learning_objectives:
- 能用列表推导式生成列表
- 能写出带条件过滤的列表推导式
concepts:
- 列表推导式
- 条件过滤
- 简洁语法
lesson:
  summary: 使用列表推导式以简洁语法构造列表，掌握带条件过滤的写法。 本节围绕“列表推导式”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 语法为 [表达式 for 变量 in 序列 if 条件]
  - if 条件用于过滤，表达式作用于满足条件的元素
  - 可读性优先，复杂逻辑仍建议用普通循环
  examples:
  - '[x * x for x in nums if x > 0]'
  common_mistakes:
  - 把过滤条件与表达式位置写反
  - 忽略“列表推导式”的适用前提，直接套用结论或代码模板。
  - 完成“列表推导式”实现后只检查一个正常样例，没有验证边界和失败路径。
assessment_ids:
- PY-LIST-03-C1
