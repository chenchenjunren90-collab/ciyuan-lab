id: PY-SET-01
title: 集合
course: python
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 35
prerequisites:
- PY-LIST-01
learning_objectives:
- 能创建集合并利用其去重特性
- 能进行并集、交集、差集运算
concepts:
- 集合
- 去重
- 并集
- 交集
- 差集
lesson:
  summary: 掌握集合的创建、去重特性以及并集、交集、差集等运算。关键要点包括：集合元素唯一且无序，常用于去重；| 或 union 求并集，& 或 intersection 求交集；- 或 difference 求差集。
  key_points:
  - 集合元素唯一且无序，常用于去重
  - '| 或 union 求并集，& 或 intersection 求交集'
  - '- 或 difference 求差集'
  examples:
  - set([1, 1, 2]) 得到 {1, 2}
  common_mistakes:
  - 误以为集合保留元素插入顺序，可通过下标稳定访问
  - 误以为集合可以直接包含列表或字典作为元素
assessment_ids:
- PY-SET-01-Q1
source_refs:
