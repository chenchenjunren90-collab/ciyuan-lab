type: debug
id: PY-EXC-01-D1
concept_id: PY-EXC-01
title: 修复除法函数缺少异常处理
difficulty: intermediate
language: python
function_name: safe_divide
buggy_code: |
  def safe_divide(a, b):
      return a / b
description: 该函数在除数为 0 时直接抛出 ZeroDivisionError，且对非数值输入会抛出 TypeError。请修改函数：除数为 0 或输入无法相除时返回 None，其余情况正常返回结果。
expected_behavior: safe_divide(10, 2) == 5.0；safe_divide(1, 0) is None；safe_divide("a", 2) is None。
public_tests:
- input:
  - 10
  - 2
  expected: 5.0
- input:
  - 1
  - 0
  expected: null
hidden_tests:
- input:
  - a
  - 2
  expected: null
- input:
  - 9
  - 3
  expected: 3.0
limits:
  time_ms: 1000
  memory_mb: 64
error_tag: missing_exception_handling
hints:
- 观察哪种输入会让原函数崩溃（除 0、非数值）。
- 用 try/except 把可能出错的除法包起来。
- except 中同时捕获 ZeroDivisionError 和 TypeError 并返回 None。
reference_solution: |
  def safe_divide(a, b):
      try:
          return a / b
      except (ZeroDivisionError, TypeError):
          return None
