id: PY-SET-01-H1
title: 课后练习：统计唯一标签
course: python
schema_version: 0.1.0
version: 1
type: code
difficulty: beginner
estimated_minutes: 15
concept_ids:
- PY-SET-01
prompt: 读取一行空格分隔的标签，第一行输出不同标签的数量，第二行按字典序输出去重后的标签。
source_refs:
- SRC-PY-GUIDE-CURRICULUM
