evaluation:
  mode: tests
  starter_code: 'tags = input().split()

    # 使用集合去重，再排序以保证输出稳定

    '
  runtime:
    language: python
    version: '3.11'
    entrypoint: main.py
    time_limit_ms: 2000
    memory_limit_mb: 128
    output_limit_kb: 64
    network_access: false
    filesystem_access: isolated
  tests:
  - id: public-duplicates
    visibility: public
    input: 'pear apple pear

      '
    expected_output: '2

      apple pear

      '
  - id: hidden-unique
    visibility: hidden
    input: 'c b a

      '
    expected_output: '3

      a b c

      '
  - id: hidden-one
    visibility: hidden
    input: 'python

      '
    expected_output: '1

      python

      '
extensions:
  learning_stage: after_class
  audience: chinese_beginner
  scaffolding:
  - set(tags) 完成去重
  - sorted(...) 产生稳定顺序
  - len(...) 计算唯一数量
  input_format: 一行一个或多个空格分隔的标签。
  output_format: 第一行数量；第二行排序后的唯一标签。
  constraints:
  - 标签区分大小写
  - 展示前必须排序，不能依赖集合内部顺序
  public_examples:
  - input: 'pear apple pear

      '
    expected_output: '2

      apple pear

      '
    explanation: 先按输入格式拆分数据，再逐步应用本节知识点；输出需与格式完全一致。
  reflection_prompt: 集合适合成员判断和去重；需要展示时通常还要排序。
