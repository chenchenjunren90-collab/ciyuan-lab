id: PY-BASE-09-H1
title: 课后练习：转换并格式化金额
course: python
schema_version: 0.1.0
version: 1
type: code
difficulty: beginner
estimated_minutes: 15
concept_ids:
- PY-BASE-09
prompt: 读取一个可能为负的小数，输出它的绝对值并固定保留 2 位小数。
source_refs:
- SRC-PY-GUIDE-CURRICULUM
- SRC-PY-EXERCISM-TRACK
- SRC-PY-INTERACTIVE-TUTORIALS
evaluation:
  mode: tests
  starter_code: 'text = input()

    # 转成数值、取绝对值并格式化

    '
  runtime:
    language: python
    version: '3.11'
    entrypoint: main.py
    time_limit_ms: 2000
    memory_limit_mb: 128
    output_limit_kb: 64
    network_access: false
    filesystem_access: isolated
  tests:
  - id: public-negative
    visibility: public
    input: '-3.14159

      '
    expected_output: '3.14

      '
  - id: hidden-integer
    visibility: hidden
    input: '2

      '
    expected_output: '2.00

      '
  - id: hidden-positive
    visibility: hidden
    input: '9.876

      '
    expected_output: '9.88

      '
extensions:
  learning_stage: after_class
  audience: chinese_beginner
  scaffolding:
  - float() 完成转换
  - abs() 求绝对值
  - f-string 的 :.2f 控制显示格式
  input_format: 一行可转换为 float 的数字文本。
  output_format: 绝对值，固定保留 2 位小数。
  constraints:
  - 输入绝对值不超过 1000000
  - 必须显示末尾的零
  public_examples:
  - input: '-3.14159

      '
    expected_output: '3.14

      '
    explanation: 先按输入格式拆分数据，再逐步应用本节知识点；输出需与格式完全一致。
  reflection_prompt: 计算精度和显示格式是两个问题；题目要求“保留两位”时要控制输出格式。
  source_adaptation:
    source_id: SRC-PY-EXERCISM-TRACK
    source_scope: 'concept: builtins / numeric conversion'
    method: 保留能力目标与边界测试思路，使用中文重写题面、提示、样例和测试。
