id: PY-LIST-01-H1
title: 课后练习：安全访问列表
course: python
schema_version: 0.1.0
version: 1
type: code
difficulty: beginner
estimated_minutes: 15
concept_ids:
- PY-LIST-01
prompt: 第一行读取若干整数，第二行读取索引 i。若 i 在 Python 合法索引范围内，输出对应元素；否则输出“越界”。
source_refs:
- SRC-PY-GUIDE-CURRICULUM
- SRC-PY-EXERCISM-TRACK
- SRC-PY-INTERACTIVE-TUTORIALS
evaluation:
  mode: tests
  starter_code: 'numbers = list(map(int, input().split()))

    index = int(input())

    # 同时考虑正索引和负索引

    '
  runtime:
    language: python
    version: '3.11'
    entrypoint: main.py
    time_limit_ms: 2000
    memory_limit_mb: 128
    output_limit_kb: 64
    network_access: false
    filesystem_access: isolated
  tests:
  - id: public-positive
    visibility: public
    input: '10 20 30

      1

      '
    expected_output: '20

      '
  - id: public-negative
    visibility: public
    input: '10 20 30

      -1

      '
    expected_output: '30

      '
  - id: hidden-left-bound
    visibility: hidden
    input: '5 6

      -2

      '
    expected_output: '5

      '
  - id: hidden-out
    visibility: hidden
    input: '5 6

      2

      '
    expected_output: '越界

      '
extensions:
  learning_stage: after_class
  audience: chinese_beginner
  scaffolding:
  - 正索引上界是 len(numbers)-1
  - 负索引下界是 -len(numbers)
  - 先判断范围再访问，避免异常
  input_format: 第一行非空整数列表；第二行整数索引。
  output_format: 对应元素或越界。
  constraints:
  - 列表长度至少为 1
  - 合法范围为 -len(numbers) 到 len(numbers)-1
  public_examples:
  - input: '10 20 30

      1

      '
    expected_output: '20

      '
    explanation: 先按输入格式拆分数据，再逐步应用本节知识点；输出需与格式完全一致。
  reflection_prompt: 访问前先把合法索引范围写出来，尤其要考虑负索引。
  source_adaptation:
    source_id: SRC-PY-EXERCISM-TRACK
    source_scope: 'concept: lists / indexing'
    method: 保留能力目标与边界测试思路，使用中文重写题面、提示、样例和测试。
status: draft
