id: PY-ALGO-01-H1
title: 课后练习：二分查找位置
course: python
schema_version: 0.1.0
version: 1
type: code
difficulty: intermediate
estimated_minutes: 25
concept_ids:
- PY-ALGO-01
prompt: 第一行读取升序且不重复的整数列表，第二行读取目标值。使用二分查找输出目标下标；不存在输出 -1。
source_refs:
- SRC-PY-GUIDE-CURRICULUM
- SRC-PY-EXERCISM-TRACK
- SRC-PY-INTERACTIVE-TUTORIALS
evaluation:
  mode: tests
  starter_code: 'numbers = list(map(int, input().split()))

    target = int(input())

    left, right = 0, len(numbers) - 1

    # 在 left <= right 时缩小搜索区间

    '
  runtime:
    language: python
    version: '3.11'
    entrypoint: main.py
    time_limit_ms: 2000
    memory_limit_mb: 128
    output_limit_kb: 64
    network_access: false
    filesystem_access: isolated
  tests:
  - id: public-found
    visibility: public
    input: '1 3 5 7 9

      7

      '
    expected_output: '3

      '
  - id: hidden-missing
    visibility: hidden
    input: '2 4 6

      5

      '
    expected_output: '-1

      '
  - id: hidden-first
    visibility: hidden
    input: '2 4 6

      2

      '
    expected_output: '0

      '
extensions:
  learning_stage: after_class
  audience: chinese_beginner
  scaffolding:
  - 中点是 (left + right) // 2
  - 目标更大时令 left = middle + 1
  - 循环结束仍未找到时输出 -1
  input_format: 第一行升序整数；第二行目标整数。
  output_format: 目标下标或 -1。
  constraints:
  - 列表非空且元素互不重复
  - 不得调用 list.index()
  public_examples:
  - input: '1 3 5 7 9

      7

      '
    expected_output: '3

      '
    explanation: 先按输入格式拆分数据，再逐步应用本节知识点；输出需与格式完全一致。
  reflection_prompt: 二分查找重点是区间含义和边界不变量，不是背代码。
  source_adaptation:
    source_id: SRC-PY-EXERCISM-TRACK
    source_scope: 'concept: binary search / boundary tests'
    method: 保留能力目标与边界测试思路，使用中文重写题面、提示、样例和测试。
status: draft
