- PY-FILE-04
prompt: 读取一行 JSON 对象，使用 json.loads 解析，再使用 json.dumps 按键排序、紧凑输出；中文不得转义为 Unicode 编码。
source_refs:
- SRC-PY-GUIDE-CURRICULUM
- SRC-PY-EXERCISM-TRACK
