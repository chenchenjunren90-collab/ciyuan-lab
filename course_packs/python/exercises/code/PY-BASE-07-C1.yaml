type: code
language: python
id: PY-BASE-07-C1
concept_id: PY-BASE-07
title: 偶数求和
difficulty: beginner
function_name: sum_evens
signature: 'sum_evens(n: int) -> int'
statement: 实现函数 sum_evens(n)：使用 for 循环与 range，返回 1 到 n（含 n）之间所有偶数的和。
public_tests:
- input:
  - 10
  expected: 30
- input:
  - 1
  expected: 0
hidden_tests:
- input:
  - 2
  expected: 2
- input:
  - 100
  expected: 2550
- input:
  - 0
  expected: 0
limits:
  time_ms: 1000
  memory_mb: 64
hints:
- 用 range(1, n + 1) 遍历 1 到 n 的所有整数。
- 用 if i % 2 == 0 判断当前数是否为偶数。
- 累加满足条件的 i 到总和变量中。
feedback:
- range 的右端点要 +1 才能包含 n。
- n 为 0 或 1 时结果应为 0，注意空区间边界。
reference_solution: |
  def sum_evens(n):
      total = 0
      for i in range(1, n + 1):
          if i % 2 == 0:
              total += i
      return total
