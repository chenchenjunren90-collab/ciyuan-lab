type: code
language: python
id: PY-LIST-03-C1
concept_id: PY-LIST-03
title: 正数平方（列表推导式）
difficulty: intermediate
function_name: positive_squares
signature: 'positive_squares(nums: list[int]) -> list[int]'
statement: 实现函数 positive_squares(nums)：使用列表推导式，返回 nums 中所有正数的平方组成的新列表，保持原顺序。
public_tests:
- input:
  - - -1
    - 2
    - 3
  expected:
  - 4
  - 9
- input:
  - []
  expected: []
hidden_tests:
- input:
  - - 0
    - 0
    - 0
  expected: []
- input:
  - - -5
    - 1
    - -2
    - 4
  expected:
  - 1
  - 16
limits:
  time_ms: 1000
  memory_mb: 64
hints:
- 列表推导式语法为 [表达式 for 变量 in 序列 if 条件]。
- 用 x > 0 过滤掉非正数。
- 表达式部分写 x * x 得到平方。
feedback:
- 0 不是正数，应被过滤掉。
- 结果顺序应与输入中正数的出现顺序一致。
reference_solution: |
  def positive_squares(nums):
      return [x * x for x in nums if x > 0]
