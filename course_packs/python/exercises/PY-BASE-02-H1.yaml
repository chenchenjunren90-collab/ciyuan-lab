id: PY-BASE-02-H1
title: 课后练习：整理个人信息
course: python
schema_version: 0.1.0
version: 1
type: code
difficulty: beginner
estimated_minutes: 15
concept_ids:
- PY-BASE-02
prompt: 读取由空格分隔的姓名、年龄和身高（米），输出“姓名:...;年龄:...;身高:...”；身高保留 2 位小数。
source_refs:
- SRC-PY-GUIDE-CURRICULUM
- SRC-PY-EXERCISM-TRACK
- SRC-PY-INTERACTIVE-TUTORIALS
evaluation:
  mode: tests
  starter_code: 'name, age_text, height_text = input().split()

    # 转换类型并格式化输出

    '
  runtime:
    language: python
    version: '3.11'
    entrypoint: main.py
    time_limit_ms: 2000
    memory_limit_mb: 128
    output_limit_kb: 64
    network_access: false
    filesystem_access: isolated
  tests:
  - id: public-normal
    visibility: public
    input: '小词 18 1.72

      '
    expected_output: '姓名:小词;年龄:18;身高:1.72

      '
  - id: hidden-format
    visibility: hidden
    input: '小元 20 1.8

      '
    expected_output: '姓名:小元;年龄:20;身高:1.80

      '
extensions:
  learning_stage: after_class
  audience: chinese_beginner
  scaffolding:
  - 先 split() 得到三个字符串
  - 年龄用 int()，身高用 float()
  - 使用 :.2f 控制小数位数
  input_format: 一行三个字段：姓名 年龄 身高。
  output_format: 按指定字段顺序输出，身高固定保留 2 位小数。
  constraints:
  - 年龄是非负整数
  - 身高是可以转换为 float 的正数
  public_examples:
  - input: '小词 18 1.72

      '
    expected_output: '姓名:小词;年龄:18;身高:1.72

      '
    explanation: 先按输入格式拆分数据，再逐步应用本节知识点；输出需与格式完全一致。
  reflection_prompt: 变量名应表达含义；转换前后的值最好使用不同名字，便于排错。
  source_adaptation:
    source_id: SRC-PY-EXERCISM-TRACK
    source_scope: 'concept: basics / tutorial: Variables and Types'
    method: 保留能力目标与边界测试思路，使用中文重写题面、提示、样例和测试。
status: draft
