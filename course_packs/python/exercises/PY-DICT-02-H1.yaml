id: PY-DICT-02-H1
title: 课后练习：按成绩排序记录
course: python
schema_version: 0.1.0
version: 1
type: code
difficulty: intermediate
estimated_minutes: 25
concept_ids:
- PY-DICT-02
prompt: 第一行读取记录数 n，随后 n 行每行包含姓名和整数成绩。按成绩从高到低排序；同分按姓名字典序排序，逐行输出“姓名 成绩”。
source_refs:
- SRC-PY-GUIDE-CURRICULUM
- SRC-PY-EXERCISM-TRACK
- SRC-PY-INTERACTIVE-TUTORIALS
evaluation:
  mode: tests
  starter_code: "n = int(input())\nrecords = {}\nfor _ in range(n):\n    name, score_text = input().split()\n\
    \    records[name] = int(score_text)\n# 使用 items() 得到键值对并排序\n"
  runtime:
    language: python
    version: '3.11'
    entrypoint: main.py
    time_limit_ms: 2000
    memory_limit_mb: 128
    output_limit_kb: 64
    network_access: false
    filesystem_access: isolated
  tests:
  - id: public-normal
    visibility: public
    input: '3

      小词 88

      小元 95

      小码 88

      '
    expected_output: '小元 95

      小码 88

      小词 88

      '
  - id: hidden-one
    visibility: hidden
    input: '1

      A 60

      '
    expected_output: 'A 60

      '
  - id: hidden-tie
    visibility: hidden
    input: '3

      C 90

      A 90

      B 80

      '
    expected_output: 'A 90

      C 90

      B 80

      '
extensions:
  learning_stage: after_class
  audience: chinese_beginner
  scaffolding:
  - records.items() 产生 (姓名, 成绩)
  - 排序键可写成 (-成绩, 姓名)
  - 输出时对元组解包
  input_format: 第一行 n；随后 n 行：姓名 成绩。
  output_format: 按指定规则排序后的姓名和成绩。
  constraints:
  - 1 <= n <= 100
  - 姓名互不重复
  - 0 <= 成绩 <= 100
  public_examples:
  - input: '3

      小词 88

      小元 95

      小码 88

      '
    expected_output: '小元 95

      小码 88

      小词 88

      '
    explanation: 先按输入格式拆分数据，再逐步应用本节知识点；输出需与格式完全一致。
  reflection_prompt: 多条件排序时，先明确每个字段是升序还是降序。
  source_adaptation:
    source_id: SRC-PY-EXERCISM-TRACK
    source_scope: 'concept: dict iteration / sorting records'
    method: 保留能力目标与边界测试思路，使用中文重写题面、提示、样例和测试。
status: draft
