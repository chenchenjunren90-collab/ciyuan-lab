- PY-BASE-01
prompt: 读取一行姓名，输出“你好，姓名！”。姓名两侧可能有空格，输出前需要去掉这些空格。
source_refs:
- SRC-PY-GUIDE-CURRICULUM
- SRC-PY-EXERCISM-TRACK
- SRC-PY-INTERACTIVE-TUTORIALS
evaluation:
  mode: tests
  starter_code: 'name = input()

    # 去掉姓名两侧的空格，再按指定格式输出

    '
  runtime:
    language: python
    version: '3.11'
    entrypoint: main.py
    time_limit_ms: 2000
    memory_limit_mb: 128
    output_limit_kb: 64
    network_access: false
    filesystem_access: isolated
  tests:
  - id: public-normal
    visibility: public
    input: '小词

      '
    expected_output: '你好，小词！

      '
  - id: hidden-spaces
    visibility: hidden
    input: "  小元  \n"
    expected_output: '你好，小元！

      '
extensions:
  learning_stage: after_class
  audience: chinese_beginner
  scaffolding:
  - 先用 input() 读取字符串
  - 使用 strip() 处理首尾空格
  - 使用 f-string 组合最终文本
  input_format: 一行文本，表示姓名。
  output_format: 一行问候语，格式必须为：你好，姓名！
  constraints:
  - 姓名去除首尾空格后至少包含 1 个字符
  - 不得输出额外提示文字
  public_examples:
  - input: '小词

      '
    expected_output: '你好，小词！

      '
    explanation: 先按输入格式拆分数据，再逐步应用本节知识点；输出需与格式完全一致。
  reflection_prompt: 程序成功运行只是第一步，还要逐字核对输出中的中文标点。
  source_adaptation:
    source_id: SRC-PY-EXERCISM-TRACK
    source_scope: 'concept: basics / practice: hello-world'
    method: 保留能力目标与边界测试思路，使用中文重写题面、提示、样例和测试。
