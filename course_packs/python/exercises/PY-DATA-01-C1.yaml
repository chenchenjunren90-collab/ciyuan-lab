id: PY-DATA-01-C1
title: 分数清洗
course: python
schema_version: 0.1.0
version: 2
type: code
difficulty: intermediate
estimated_minutes: 15
concept_ids:
- PY-DATA-01
prompt: 从标准输入读取多行数据（每行是一条记录的 score 字段，可能为空串、非数字、越界或重复），清洗后按原顺序输出所有能转成整数且在 0—100（含）之间的分数；重复分数只保留第一次，每个结果一行。
source_refs:
- SRC-PY-OUTLINE-01
- SRC-PY-OFFICIAL-REF
evaluation:
  mode: tests
  runtime:
    language: python
    version: '3.11'
    entrypoint: main.py
    time_limit_ms: 2000
    memory_limit_mb: 128
    output_limit_kb: 64
    network_access: false
    filesystem_access: isolated
  tests:
  - id: public-01
    visibility: public
    input: '85


      85

      abc

      101

      72

      '
    expected_output: '85

      72

      '
  - id: hidden-01
    visibility: hidden
    input: '0

      100

      0

      -1

      '
    expected_output: '0

      100

      '
  - id: hidden-02
    visibility: hidden
    input: '


      '
    expected_output: ''
