summary: 将一段文本清洗、切分并统计词频，使用函数拆分处理步骤，输出可复核的排序报告。
requirements:
- 清理大小写与常见标点，将文本转换为词语列表
- 使用字典安全累计词频，不因首次出现的单词报错
- 将清洗、统计和排序拆分为职责明确的函数
- 对空文本、重复词、并列频次和中文空白编写测试
deliverables:
- 可运行的 Python 3.11 程序
