    text: |
      【异常处理】语法错误发生在解析阶段，运行期异常则由具体操作触发。try 中只放可能失败的最小代码，except 捕获可处理的具体异常，else 放无异常时执行的逻辑，finally 放必须清理的动作。不要用空 except 隐藏真实错误。

      【自定义异常】当调用者需要区分特定业务失败时，可以定义继承 Exception 的异常类。raise 用于主动报告不满足的前置条件，异常消息应包含可定位的上下文。是否捕获取决于当前层能否真正处理，而不是为了让错误消失。

      【模块与 import】模块是包含定义与语句的 Python 文件。import 建立清晰依赖，from ... import ... 应避免名称冲突。可执行入口常用 if __name__ == "__main__" 隔离，使模块既能被导入测试也能独立运行。较大程序应按职责拆分模块而不是复制函数。

      【常用标准库】pathlib 处理路径，datetime 处理日期时间，collections 提供专用容器，statistics 提供基础统计，json/csv 处理常见数据格式。使用前应阅读接口契约，特别关注时区、编码、舍入和平台差异。

      【类与对象】类把状态与操作状态的方法组合起来，实例通过构造过程建立有效状态。self 指向当前实例；实例属性与类属性含义不同。面向对象适合需要维护多个具有共同规则的对象，不应为了“看起来高级”把简单函数强行改成类。

      【排序与查找】sorted 返回新列表，list.sort 原地修改列表；key 函数定义比较依据。线性查找适合无序小数据，二分查找要求数据已按同一规则排序。分析算法时同时考虑输入规模、时间复杂度、空间占用和准备数据的成本。

      【递归】递归函数需要明确基本情况和向基本情况靠近的递归步骤。递归适合自然具有层次结构的问题，但 Python 存在递归深度限制；可用循环清楚表达的问题通常优先循环。调试递归时记录参数变化和返回路径。

      【调试流程】先固定一个能稳定失败的最小输入，记录期望与实际；再定位是输入、状态、分支、循环还是输出环节；一次只验证一个假设。修复后增加回归测试，防止同类缺陷再次出现。报错信息、堆栈和失败测试是证据，不是惩罚。

      【测试与工程边界】公开样例帮助理解题意，隐藏测试覆盖未展示的边界，但不能泄漏。自动化测试应验证公开行为，不依赖执行顺序和外部网络。代码运行应限制时间、内存、文件与网络权限，用户代码与主服务隔离。

      【项目组织】可维护项目应拆分模块、隔离文件与网络副作用、固定依赖、记录错误上下文，并用 README 说明运行方式。综合项目的评价证据包括可运行代码、测试结果、数据说明和结果解释，而不只是页面截图。
