    text: |
      【函数定义与调用】函数用 def 定义，函数名应表达职责。参数是输入，return 是显式输出；没有执行 return 时返回 None。一个函数宜完成一件清晰的事，先写调用样例和期望结果，再实现内部步骤。

      【参数与返回值】位置参数、关键字参数和默认参数共同构成调用接口。默认值应表示稳定缺省行为；可变对象不宜直接作为默认值，可使用 None 后在函数体内创建。返回多个值实际会形成元组，调用者应按清晰方式接收。

      【可变参数】*args 收集额外位置参数为元组，**kwargs 收集额外关键字参数为字典。可变参数适合包装通用接口，但不应掩盖本可明确命名的重要参数。调用时 * 可展开序列，** 可展开键为字符串的映射。

      【作用域】名称查找遵循局部、外层函数、全局、内置的顺序。函数内赋值默认创建局部名称；nonlocal 修改最近的外层函数绑定，global 修改模块级绑定。与其依赖大量全局状态，更推荐通过参数传入、通过返回值传出，便于测试。

      【lambda 与高阶函数】lambda 只能包含一个表达式，适合简短的排序键等局部用途；复杂逻辑应使用具名函数。函数可作为参数和返回值，因此 sorted 的 key、map、filter 等都能接收函数。为了可读性，列表推导式往往比叠加多个 map/filter 更直观。

      【迭代器】可迭代对象能产生迭代器，迭代器通过 next() 逐个提供值并在结束时触发 StopIteration。for 循环会自动处理这一协议。迭代器通常只能向前消费，已经取出的数据不会自动重来。

      【生成器】含 yield 的函数返回生成器。每次迭代从上次暂停处继续，适合逐步产生大量数据，避免一次性全部装入内存。生成器中的副作用发生在实际迭代时，而不是创建生成器时；调试时要区分“已创建”和“已消费”。

      【函数测试与设计】至少覆盖正常输入、边界输入和非法输入；纯函数更容易测试。若函数读文件、访问网络或修改外部状态，应把这些副作用与核心计算分开。类型标注和文档字符串能说明接口，但不能替代运行测试。
