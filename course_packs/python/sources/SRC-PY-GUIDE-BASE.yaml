    text: |
      【运行环境与第一个程序】Python 源文件通常使用 .py 扩展名和 UTF-8 编码，由解释器执行。入门者应区分交互式命令与脚本文件：交互式环境适合短实验，脚本适合保存、复现和测试。print() 把内容写到标准输出；程序能运行不等于逻辑正确，还需要使用明确输入和预期输出验证。

      【对象、变量与类型】Python 中变量名绑定对象，对象具有类型和值。常用基础类型包括 int、float、bool、str 和 NoneType。赋值不会自动复制可变对象；多个名称可能指向同一对象。type() 用于观察类型，isinstance() 适合判断对象是否属于某类。类型转换必须考虑空字符串、非法字符和精度边界。

      【运算符与表达式】算术、比较和布尔运算符共同构成表达式。比较可以链式书写；and 与 or 具有短路行为；== 比较值，is 比较对象身份。混合运算时不要依赖记忆猜优先级，复杂表达式应使用括号表达意图，并用边界输入验证结果。

      【输入与输出】input() 返回字符串，因此数值计算前通常需要 int() 或 float() 转换。一次读取多个数据时，可先 split() 分词，再逐项转换。print() 可用 sep 控制分隔符、end 控制结尾；格式化输出优先使用 f-string。题目中的“空行”“空格分隔”和“小数位数”都是可测试的输出契约。

      【条件语句】if、elif、else 按顺序判断分支，只执行首个满足条件的分支。区间问题应先确定边界是否包含，分支顺序应避免宽条件遮蔽窄条件。布尔值、零、空字符串和空容器具有真假语义，但关键业务判断宜写得明确。

      【while 循环】while 适合循环次数事先不确定、由条件决定是否继续的任务。循环必须包含可使条件变化的步骤，否则可能无限运行。设计时应写清初始化、继续条件、循环体和状态更新，并测试零次执行、一次执行和多次执行。

      【for 与 range】for 会从可迭代对象中逐项取值；range(start, stop, step) 生成整数序列且不包含 stop。遍历元素时直接写 for item in values，确实需要位置时使用 enumerate。不要一边遍历列表一边随意改变其长度，必要时遍历副本或构造新结果。

      【循环控制】break 立即结束最近一层循环，continue 跳过本轮余下语句，循环 else 只在循环未被 break 终止时执行。使用这些结构时应让退出条件清晰；多层循环中的 break 不会自动退出外层循环。

      【常用内置函数与综合语法】len、sum、min、max、sorted、enumerate、zip、any、all 能表达常见操作，但调用前要确认空输入和类型要求。综合题应先拆成输入、转换、处理、输出四段，再逐段写小样例，避免把所有逻辑塞进一个长表达式。

      【列表与列表推导式】列表是有序、可变容器，支持索引、切片、append、extend、insert、remove、pop 和排序等操作。处理列表时可以先用 for 遍历，再用 if 决定是否保留并 append 到新列表。列表推导式的过滤形式是 [结果表达式 for 变量 in 序列 if 条件]；复杂逻辑仍优先使用普通循环。空列表、边界值和结果顺序都需要测试。

      【字符串、元组、集合与字典】字符串是不可变字符序列，索引和切片规则与列表相近；常用方法包括 strip、split、join、replace 和大小写转换。单元素元组依靠逗号形成。集合适合去重和成员判断，不保证业务展示顺序。字典保存键值映射，键必须可哈希；访问不确定键时可用 get，遍历键值使用 items。嵌套容器应先画清层次再选择索引或键。
