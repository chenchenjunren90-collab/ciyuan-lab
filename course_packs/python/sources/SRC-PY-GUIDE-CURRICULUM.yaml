    text: |
      【课程全貌】课程以 40 个核心知识点组成八个递进单元：运行环境与基础表达式，输入输出与控制流，字符串与基础容器，列表字典与函数，模块文件与异常，类对象与迭代，排序查找与递归，数据处理与综合项目。每个单元都包含讲解、理解检查、代码练习和可追溯测评证据。

      【单元一：起步】PY-BASE-01 到 PY-BASE-04 覆盖解释器、变量、基本类型、运算符、表达式、输入与输出。完全没有编程经历的学习者从这里开始；已经能独立编写输入—处理—输出短程序者可通过诊断跳过重复讲解。

      【单元二：控制流】PY-BASE-05 到 PY-BASE-10 覆盖 if、while、for、range、break、continue、循环 else、类型转换和基础语法综合。学习证据不仅是选择题，还应包括能处理边界的短代码。

      【单元三：文本与容器】PY-STR-01 到 PY-STR-03、PY-TUPLE-01、PY-SET-01、PY-LIST-01 到 PY-LIST-03、PY-DICT-01 到 PY-DICT-02、PY-CONTAINER-01 组成容器路线。学习者要根据顺序、可变性、唯一性和键值映射选择结构，并能完成遍历、筛选、统计和格式化。

      【单元四：函数与迭代】PY-FUNC-01 到 PY-FUNC-05 覆盖定义调用、参数返回值、可变参数、作用域、lambda 与高阶函数；PY-ITER-01 覆盖迭代器和生成器。目标是把一段长程序拆成接口清楚、可独立测试的函数。

      【单元五：模块、文件与异常】PY-MOD-01 到 PY-MOD-02、PY-FILE-01 到 PY-FILE-04、PY-EXC-01 到 PY-EXC-02 覆盖模块组织、标准库、文本文件、with、CSV、JSON 和异常边界。学习者应能解释失败原因并保留错误上下文。

      【单元六：对象与算法】PY-OOP-01 覆盖类与对象；PY-ALGO-01 到 PY-ALGO-02 覆盖排序、查找和递归初步。重点不是堆叠语法，而是选择合适抽象、说明复杂度并用测试证明行为。

      【单元七：数据处理】PY-DATA-01、PY-DATA-02 以及前面文件、字典、函数和异常知识共同组成数据任务。顺序为字段理解、解析校验、清洗转换、统计聚合、输出解释。财经场景只作为脱敏应用背景，评价核心仍是计算机能力。

      【能力匹配规则】学生自述可提供经历、目标和困难信号，但不能单独证明掌握。课程先用自述给出保守起点，再用跨单元诊断题校正；后续根据测评、练习和代码测试持续更新掌握度。若自述与客观证据冲突，以近期客观证据为主。

      【个性化原则】零基础学习者采用小步讲解、完整样例和频繁确认；有语法基础者减少重复讲解，增加容器、函数和调试；有项目经验者直接用算法、数据处理和综合项目验证迁移能力。个性化改变起点、顺序、讲练比例和题目难度，不改变课程知识标准。

      【完整学习闭环】一次学习循环包括：描述目标与经历，完成能力诊断，确认可修改的学习计划，进入教师主讲课堂，完成理解检查和代码沙箱验证，阶段重测，更新画像，再生成新的练习或综合项目。课堂完成度与能力掌握度分别计算，不能混为一个百分比。
