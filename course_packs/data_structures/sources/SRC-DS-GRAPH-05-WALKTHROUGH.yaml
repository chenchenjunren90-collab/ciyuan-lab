    text: "DS-GRAPH-05 Dijkstra 最短路径（自编讲义草稿，待人工审核）\n\n在非负权图上通过松弛和优先队列求最短路。关键要点包括：Dijkstra 适用于边权非负的图，通过松弛不断改进从源点到各点的上界；优先队列每次选择当前距离最小的未确定顶点，过期队列项应被跳过；使用前驱数组恢复路径，并单独表示不可达距离，防止无穷值参与溢出运算。\n\
      \nDijkstra 适用于边权非负的图，通过松弛不断改进从源点到各点的上界。\n优先队列每次选择当前距离最小的未确定顶点，过期队列项应被跳过。\n使用前驱数组恢复路径，并单独表示不可达距离，防止无穷值参与溢出运算。\n\
      \n用优先队列计算非负权图最短路，并跳过过期的距离条目。\n\n先从 0 得到到 1 的候选距离 4、到 2 的候选距离 1。\n优先处理 2，把到 1 的距离改成 3；随后从 1 把到\
      \ 3 的距离改成 4。\n旧的 (4,1) 和 (6,3) 留在堆中，取出时必须根据当前距离跳过。\n\nimport heapq\ngraph = [[(1, 4), (2, 1)],\
      \ [(3, 1)], [(1, 2), (3, 5)], []]\ndistance = [float(\"inf\")] * len(graph)\ndistance[0] = 0\n\
      heap = [(0, 0)]\nwhile heap:\n    current, u = heapq.heappop(heap)\n    if current != distance[u]:\n\
      \        continue\n    for v, weight in graph[u]:\n        candidate = current + weight\n  \
      \      if candidate < distance[v]:\n            distance[v] = candidate\n            heapq.heappush(heap,\
      \ (candidate, v))\nprint(distance)\n\n\n前提为非负权重。该惰性堆实现最多保存 O(E) 条候选，时间可界为 O(V+E log(E+1))，额外空间\
      \ O(V+E)。\n\n常见错误：图中存在负权边仍使用 Dijkstra，已确定距离可能被后来路径改小。；只输出距离而不检查顶点是否不可达。\n\n自测：为什么存在负权边时，不能直接套用\
      \ Dijkstra 的正确性证明？"
