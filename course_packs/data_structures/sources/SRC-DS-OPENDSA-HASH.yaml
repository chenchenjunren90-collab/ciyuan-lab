    "content": {
      "mode": "inline",
      "text": "开放寻址删除后不能直接把槽位改成“从未使用”，否则后续查找可能在这里提前停止，找不到探测序列更后面的键。墓碑表示曾经占用但已删除，查找遇到它应继续。\n\n推演任务：容量 5，散列函数 key%5，线性探测，依次插入 1、6、11，再删除 6。解释查找 11 为什么必须越过墓碑；重新插入 11 时为什么不能见墓碑就立即写入。\n\n本平台补充有限探测边界：最多检查一整圈，记录首个墓碑，确认无重复后才复用。即使没有真正的空槽，只要存在墓碑仍可插入；两种位置都没有时应报告满表，而不是无限循环。\n\n改编来源：[OpenDSA：散列表删除导读](https://github.com/OpenDSA/OpenDSA/blob/cf5f5d9fc0e2743a6664777ab35adae79ab5b121/RST/en/Hashing/HashDel.rst)，Cliff Shaffer / OpenDSA Project Contributors，版本 cf5f5d9。许可：[MIT](https://github.com/OpenDSA/OpenDSA/blob/cf5f5d9fc0e2743a6664777ab35adae79ab5b121/MIT-license.txt)。本段由词元研究所借助 AI 重写导读、练习任务和边界说明，待教师审核；不表示原作者认可本平台。完整版权与许可见课程包 sources/OPENDSA-LICENSE.txt。"
    }
