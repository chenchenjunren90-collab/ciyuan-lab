    "content": {
      "mode": "inline",
      "text": "只有在已排序等前提成立时，中间元素的比较才能排除一半候选位置。每一步都要说清楚：还可能含有目标的位置是什么，以及为什么被排除的一段不可能含有答案。\n\n推演任务：在 [1,3,3,3,8] 中找 3。原文的普通查找可以在任一命中处停止；本平台练习明确要求最左位置，因此命中后还需保留候选答案并继续向左缩小。\n\n边界自测：空数组、只有一个元素、全部相等、目标比最小值还小。迭代搜索的比较次数为 O(log n)，但如果先排序，排序成本不能算成免费。\n\n改编来源：[OpenDSA：二分查找导读](https://github.com/OpenDSA/OpenDSA/blob/cf5f5d9fc0e2743a6664777ab35adae79ab5b121/RST/en/Searching/BinarySearch.rst)，Cliff Shaffer / OpenDSA Project Contributors，版本 cf5f5d9。许可：[MIT](https://github.com/OpenDSA/OpenDSA/blob/cf5f5d9fc0e2743a6664777ab35adae79ab5b121/MIT-license.txt)。本段由词元研究所借助 AI 重写导读、练习任务和边界说明，待教师审核；不表示原作者认可本平台。完整版权与许可见课程包 sources/OPENDSA-LICENSE.txt。"
