  options:
  - id: A
    text: 中缀转后缀时依据优先级和结合性弹出运算符，括号控制弹栈边界但不进入结果。
  - id: B
    text: 计算后缀表达式 a b - 时先弹出的 b 应作为左操作数，因此结果是 b-a。
  - id: C
    text: 括号匹配只需统计左右括号数量相同，无需检查类型和嵌套次序。
