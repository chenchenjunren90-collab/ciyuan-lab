  - id: A
    text: 开放寻址沿探测序列寻找位置，删除时通常使用墓碑，不能直接改为空槽中断后续查找。
  - id: B
    text: 开放寻址删除键后可直接把槽设为从未使用，不会影响其他发生冲突的键。
  - id: C
    text: 线性探测完全消除了聚集现象，因此装载因子接近 1 时仍保持稳定常数时间。
