prompt: 关于“双端队列”，下列哪项说法正确？
source_refs:
- SRC-DS-GUIDE-LINEAR
evaluation:
  mode: exact
  options:
  - id: A
    text: 两端索引与空满状态必须采用一致约定，避免最后一个元素删除后状态歧义。
  - id: B
    text: 双端队列允许 O(1) 访问和删除任意中间位置，因此等价于随机访问数组。
  - id: C
    text: 用单调队列求滑动窗口最大值时，过期下标无需删除，因为值仍可能最大。
  accepted_answers:
  - A
