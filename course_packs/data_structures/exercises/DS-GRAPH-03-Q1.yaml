prompt: 关于“深度优先搜索”，下列哪项说法正确？
source_refs:
- SRC-DS-GUIDE-TREEGRAPH
evaluation:
  mode: exact
  options:
  - id: A
    text: 必须在顶点首次发现时标记访问，否则含环图可能重复入栈并无法终止。
  - id: B
    text: DFS 使用先进先出队列，因此总是按与起点距离递增的层次访问。
  - id: C
    text: 在无向图中不需要 visited 标记，因为每条边只会被存储一次。
  accepted_answers:
  - A
