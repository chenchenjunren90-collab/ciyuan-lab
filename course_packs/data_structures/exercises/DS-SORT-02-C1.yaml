id: DS-SORT-02-C1
title: 编程实践：插入排序
course: data_structures
schema_version: 0.1.0
version: 2
type: code
difficulty: beginner
estimated_minutes: 20
concept_ids:
- DS-SORT-02
prompt: 读取整数序列，使用插入排序思想升序输出。
source_refs:
- SRC-DS-GUIDE-SORTSEARCH
evaluation:
  mode: tests
  runtime:
    language: python
    version: '3.11'
    entrypoint: main.py
    time_limit_ms: 2000
    memory_limit_mb: 128
    output_limit_kb: 64
    network_access: false
    filesystem_access: isolated
  tests:
  - id: case-1
    visibility: public
    input: '5

      5 2 4 1 3

      '
    expected_output: '1 2 3 4 5

      '
  - id: case-2
    visibility: hidden
    input: '1

      7

      '
    expected_output: '7

      '
  - id: case-3
    visibility: hidden
    input: '4

      2 2 -1 3

      '
    expected_output: '-1 2 2 3

      '
  - id: hidden-empty
    visibility: hidden
    input: "0\n"
    expected_output: "\n"
  - id: hidden-reversed
    visibility: hidden
    input: "5\n5 4 3 2 1\n"
    expected_output: "1 2 3 4 5\n"
extensions:
  learning_stage: in_class
  input_format: 先读取 n，再读取 n 个整数。
  output_format: 升序输出所有元素，用空格分隔；n 为 0 时输出一个空行。
  constraints:
  - 0 <= n <= 1000
  - 元素绝对值不超过 1000000
  - 使用插入排序，不调用内置排序；保持相等键原有次序
  scaffolding:
  - 第 i 轮之前，前 i 个元素已经有序。
  - 把待插入元素保存在 key 中，再右移比 key 大的元素。
  - 到达正确位置后写回 key；不要把相等元素也向右移。
  reflection_prompt: 整数输出测试无法证明稳定性；可给相等键附加不同标签，手工检查标签顺序。
status: draft
