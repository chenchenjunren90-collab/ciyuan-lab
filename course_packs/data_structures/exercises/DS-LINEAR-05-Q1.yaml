  - id: A
    text: 顺序表中间插入删除需要移动后续元素；链表在已知位置结点后只需调整链接。
  - id: B
    text: 链表在只给定下标时也能 O(1) 完成插入，因为结点不连续。
  - id: C
    text: 长度为 n 的线性表删除位置 n 是合法的，表示删除最后一个元素。
