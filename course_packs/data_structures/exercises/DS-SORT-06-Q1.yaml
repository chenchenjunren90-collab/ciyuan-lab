  options:
  - id: A
    text: 最坏时间为 Θ(n log n)，数组实现只需 O(1) 额外空间，但通常不稳定。
  - id: B
    text: 自底向上建堆需要对每个结点执行 O(log n) 工作，因此总时间必然是 Θ(n log n)。
  - id: C
    text: 堆排序保持所有相等键的原相对顺序，所以属于稳定排序。
