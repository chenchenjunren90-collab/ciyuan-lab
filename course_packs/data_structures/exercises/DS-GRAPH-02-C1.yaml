id: DS-GRAPH-02-C1
title: 编程实践：广度优先搜索
course: data_structures
schema_version: 0.1.0
version: 2
type: code
difficulty: intermediate
estimated_minutes: 20
concept_ids:
- DS-GRAPH-02
prompt: 读取无向图和起点，按邻接点编号升序输出 BFS 访问序列。
source_refs:
- SRC-DS-GUIDE-TREEGRAPH
evaluation:
  mode: tests
  runtime:
    language: python
    version: '3.11'
    entrypoint: main.py
    time_limit_ms: 2000
    memory_limit_mb: 128
    output_limit_kb: 64
    network_access: false
    filesystem_access: isolated
  tests:
  - id: case-1
    visibility: public
    input: '4 3

      0 1

      0 2

      1 3

      0

      '
    expected_output: '0 1 2 3

      '
  - id: case-2
    visibility: hidden
    input: '3 2

      0 1

      1 2

      1

      '
    expected_output: '1 0 2

      '
  - id: case-3
    visibility: hidden
    input: '1 0

      0

      '
    expected_output: '0

      '
  - id: hidden-cycle-disconnected
    visibility: hidden
    input: "5 4\n0 1\n0 2\n1 3\n2 3\n0\n"
    expected_output: "0 1 2 3\n"
  - id: hidden-parallel-loop
    visibility: hidden
    input: "3 4\n0 0\n0 1\n0 1\n1 2\n0\n"
    expected_output: "0 1 2\n"
extensions:
  learning_stage: in_class
  input_format: 第一行 n m；随后 m 行无向边 u v；最后一行起点 s。
  output_format: 从 s 可达的顶点的 BFS 出队访问序列，以空格分隔；每个顶点只输出一次。
  constraints:
  - 1 <= n <= 1000，0 <= m <= 5000
  - 顶点编号为 0 到 n - 1；自环、重复边和不连通图均可能出现
  - 每个顶点按邻居编号升序展开；排序邻接表的预处理成本应另计
  scaffolding:
  - 为无向边登记两个方向，提前按邻居编号排序。
  - 起点也要在入队时标记；不要等到出队才标记。
  - 仅输出起点所在连通分量，重复边与自环不能引起重复访问。
  reflection_prompt: 说明为什么每个顶点至多入队一次；邻接表 BFS 的 O(V+E) 不包含额外排序成本。
status: draft
