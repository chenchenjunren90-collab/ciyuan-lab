    text: 旋转只调整局部父子关系并保持二叉搜索树的中序键序不变。
  - id: B
    text: 树旋转会改变所有键的中序顺序，因此旋转后必须重新排序结点。
  - id: C
    text: 平衡树要求左右子树结点数完全相同，否则就不再是平衡树。
