summary: 在固定合成的供应链网络上实现可达性与非负权最短路径分析，技术评价聚焦图算法。
requirements:
- 解析顶点和带权边数据
- 实现 BFS 与 Dijkstra
- 处理孤立点、不可达点和重复边
- 报告复杂度与测试证据
deliverables:
- 可运行的 Python 3.11 程序
- 算法与复杂度说明
- 边界测试和结果解释
source_refs:
- SRC-DS-GUIDE-TREEGRAPH
