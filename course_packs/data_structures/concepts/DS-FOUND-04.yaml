id: DS-FOUND-04
title: 递归、递推式与调用栈
course: data_structures
schema_version: 0.1.0
version: 2
difficulty: intermediate
estimated_minutes: 30
prerequisites:
- DS-FOUND-03
learning_objectives:
- 能够解释递归、递推式与调用栈的核心规则
- 能够运用递归、递推式与调用栈解决边界明确的问题
concepts:
- 递归、递推式与调用栈
- 边界条件
- 可验证性
lesson:
  summary: 用规模递减证明终止并分析递归开销。 本节围绕“递归、递推式与调用栈”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 用规模递减证明终止并分析递归开销。
  - 使用“递归、递推式与调用栈”时必须写清输入、状态和失败条件，不能只记语法或模板。
  - 通过“递归、递推式与调用栈”的关联练习分别验证常规输入、边界输入和错误输入。
  common_mistakes:
  - 忽略“递归、递推式与调用栈”的适用前提，直接套用结论或代码模板。
  - 完成“递归、递推式与调用栈”实现后只检查一个正常样例，没有验证边界和失败路径。
  examples:
  - 关联练习示例：输入“5”时，预期输出“120”。
assessment_ids:
- DS-FOUND-04-C1
