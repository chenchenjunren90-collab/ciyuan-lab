id: DS-FOUND-03
title: 渐进记号与增长率
course: data_structures
schema_version: 0.1.0
version: 2
difficulty: beginner
estimated_minutes: 30
prerequisites:
- DS-FOUND-02
learning_objectives:
- 能够解释渐进记号与增长率的核心规则
- 能够运用渐进记号与增长率解决边界明确的问题
concepts:
- 渐进记号与增长率
- 边界条件
- 可验证性
lesson:
  summary: 使用 O、Ω、Θ 比较算法增长趋势。 本节围绕“渐进记号与增长率”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - O 给出渐进上界，Ω 给出渐进下界，Θ 表示上下界同阶。
  - 忽略常数和低阶项只适用于足够大的输入规模，不能抹去不同输入模型。
  - 比较增长率时同时说明时间、空间及最坏或平均情形。
  common_mistakes:
  - 把 O(n²) 当成必须恰好执行 n² 次。
  - 认为两个 O(n) 算法在所有输入和机器上速度完全相同。
  examples:
  - 示例：3n²+5n+7 属于 Θ(n²)，因为高阶项在 n 增大时主导增长。
