id: DS-GRAPH-05
title: Dijkstra 最短路径
course: data_structures
schema_version: 0.1.0
version: 4
difficulty: advanced
estimated_minutes: 30
prerequisites:
- DS-HEAP-02
learning_objectives:
- 对非负权图执行边松弛，跳过优先队列中的过期条目
- 说明负权边为何破坏 Dijkstra 的适用前提，并处理不可达顶点
concepts:
- Dijkstra
- 非负
- 松弛
lesson:
  summary: 在非负权图上通过松弛和优先队列求最短路。关键要点包括：Dijkstra 适用于边权非负的图，通过松弛不断改进从源点到各点的上界；优先队列每次选择当前距离最小的未确定顶点，过期队列项应被跳过；使用前驱数组恢复路径，并单独表示不可达距离，防止无穷值参与溢出运算。
  key_points:
  - Dijkstra 适用于边权非负的图，通过松弛不断改进从源点到各点的上界。
  - 优先队列每次选择当前距离最小的未确定顶点，过期队列项应被跳过。
  - 使用前驱数组恢复路径，并单独表示不可达距离，防止无穷值参与溢出运算。
  common_mistakes:
  - 图中存在负权边仍使用 Dijkstra，已确定距离可能被后来路径改小。
  - 只输出距离而不检查顶点是否不可达。
  examples:
  - 示例：若 dist[u]+w(u,v)<dist[v]，则更新 dist[v] 和 predecessor[v] 并重新入队。
  learning_sequence:
  - title: "用优先队列计算非负权图最短路，并跳过过期的距离条目。"
    content: "先从 0 得到到 1 的候选距离 4、到 2 的候选距离 1。"
  - title: "跟踪状态变化"
    content: "优先处理 2，把到 1 的距离改成 3；随后从 1 把到 3 的距离改成 4。\n\n旧的 (4,1) 和 (6,3) 留在堆中，取出时必须根据当前距离跳过。"
  - title: "边界与迁移"
    content: "前提为非负权重。该惰性堆实现最多保存 O(E) 条候选，时间可界为 O(V+E log(E+1))，额外空间 O(V+E)。"
  worked_example:
    problem: "用优先队列计算非负权图最短路，并跳过过期的距离条目。"
    steps:
    - "先从 0 得到到 1 的候选距离 4、到 2 的候选距离 1。"
    - "优先处理 2，把到 1 的距离改成 3；随后从 1 把到 3 的距离改成 4。"
    - "旧的 (4,1) 和 (6,3) 留在堆中，取出时必须根据当前距离跳过。"
    code: "import heapq\ngraph = [[(1, 4), (2, 1)], [(3, 1)], [(1, 2), (3, 5)], []]\ndistance = [float(\"inf\")] * len(graph)\ndistance[0] = 0\nheap = [(0, 0)]\nwhile heap:\n    current, u = heapq.heappop(heap)\n    if current != distance[u]:\n        continue\n    for v, weight in graph[u]:\n        candidate = current + weight\n        if candidate < distance[v]:\n            distance[v] = candidate\n            heapq.heappush(heap, (candidate, v))\nprint(distance)\n"
    reflection: "前提为非负权重。该惰性堆实现最多保存 O(E) 条候选，时间可界为 O(V+E log(E+1))，额外空间 O(V+E)。"
  checkpoint:
    prompt: "为什么存在负权边时，不能直接套用 Dijkstra 的正确性证明？"
    guidance: "先写下预测，再对照例题和交互实验；随堂练习提交后才形成评分证据。"
