id: DS-GRAPH-05
title: Dijkstra 最短路径
course: data_structures
schema_version: 0.1.0
version: 3
difficulty: advanced
estimated_minutes: 30
prerequisites:
- DS-HEAP-02
learning_objectives:
- 能够解释Dijkstra 最短路径的核心规则
- 能够运用Dijkstra 最短路径解决边界明确的问题
concepts:
- Dijkstra 最短路径
- 边界条件
- 可验证性
lesson:
  summary: 在非负权图上通过松弛和优先队列求最短路。关键要点包括：Dijkstra 适用于边权非负的图，通过松弛不断改进从源点到各点的上界；优先队列每次选择当前距离最小的未确定顶点，过期队列项应被跳过；使用前驱数组恢复路径，并单独表示不可达距离，防止无穷值参与溢出运算。
  key_points:
  - Dijkstra 适用于边权非负的图，通过松弛不断改进从源点到各点的上界。
  - 优先队列每次选择当前距离最小的未确定顶点，过期队列项应被跳过。
  - 使用前驱数组恢复路径，并单独表示不可达距离，防止无穷值参与溢出运算。
  common_mistakes:
  - 图中存在负权边仍使用 Dijkstra，已确定距离可能被后来路径改小。
  - 只输出距离而不检查顶点是否不可达。
  examples:
  - 示例：若 dist[u]+w(u,v)<dist[v]，则更新 dist[v] 和 predecessor[v] 并重新入队。
