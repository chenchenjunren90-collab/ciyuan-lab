id: DS-LINEAR-02
title: 动态数组与容量扩展
course: data_structures
schema_version: 0.1.0
version: 2
difficulty: intermediate
estimated_minutes: 30
prerequisites:
- DS-LINEAR-01
learning_objectives:
- 能够解释动态数组与容量扩展的核心规则
- 能够运用动态数组与容量扩展解决边界明确的问题
concepts:
- 动态数组与容量扩展
- 边界条件
- 可验证性
lesson:
  summary: 区分长度和容量并理解摊还扩容成本。 本节围绕“动态数组与容量扩展”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 区分长度和容量并理解摊还扩容成本。
  - 使用“动态数组与容量扩展”时必须写清输入、状态和失败条件，不能只记语法或模板。
  - 通过“动态数组与容量扩展”的关联练习分别验证常规输入、边界输入和错误输入。
  common_mistakes:
  - 忽略“动态数组与容量扩展”的适用前提，直接套用结论或代码模板。
  - 完成“动态数组与容量扩展”实现后只检查一个正常样例，没有验证边界和失败路径。
  examples:
  - 示例：为“动态数组与容量扩展”写出一个最小正常样例和一个边界样例，并逐步记录状态变化。
