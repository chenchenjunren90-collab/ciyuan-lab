id: DS-EVAL-01
title: 算法边界测试与性能验证
course: data_structures
schema_version: 0.1.0
version: 3
difficulty: advanced
estimated_minutes: 30
prerequisites:
- DS-DESIGN-01
learning_objectives:
- 能判断与“算法边界测试与性能验证”有关的合法操作、适用条件和结果
- 能根据给定输入推演“算法边界测试与性能验证”的关键状态并验证边界
concepts:
- 算法边界测试与性能验证
- 边界条件
- 可验证性
lesson:
  summary: 用正确性样例、边界输入和规模实验验证实现。关键要点包括：正确性验证应覆盖空输入、最小规模、重复值、极端顺序和非法输入，并为每类准备可判定的预期结果；性能评估要固定输入规模、分布、实现与环境，区分理论复杂度和实测常数；随机测试可与可信朴素算法做差分比较，但测试通过仍不能替代不变量或数学证明。
  key_points:
  - 正确性验证应覆盖空输入、最小规模、重复值、极端顺序和非法输入，并为每类准备可判定的预期结果。
  - 性能评估要固定输入规模、分布、实现与环境，区分理论复杂度和实测常数。
  - 随机测试可与可信朴素算法做差分比较，但测试通过仍不能替代不变量或数学证明。
  common_mistakes:
  - 误以为算法通过一个大规模随机样例后即可证明对所有输入都正确。
  - 误以为比较两个算法只需各运行一次，耗时更短者在所有规模和环境中都更优。
  examples:
  - 验证示例：对排序实现生成含空数组、单元素、重复值和逆序数组的集合，并逐项与语言库排序结果比较。
