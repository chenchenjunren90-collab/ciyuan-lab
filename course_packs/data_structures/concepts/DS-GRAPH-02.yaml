id: DS-GRAPH-02
title: 广度优先搜索
course: data_structures
schema_version: 0.1.0
version: 5
difficulty: intermediate
estimated_minutes: 30
prerequisites:
- DS-GRAPH-01
learning_objectives:
- 在入队时标记顶点，使用队列逐层遍历邻接表
- 处理环、重复边和不可达顶点，区分遍历顺序与最短边数
concepts:
- 广度优先
- 队列
- 邻接表
lesson:
  summary: 使用队列按层访问并求无权最短路。关键要点包括：BFS 用队列保存已发现但尚未展开的顶点，按距离层次访问；顶点入队时立即标记已访问，避免同一顶点被多个邻居重复加入；在无权图中首次到达顶点的层数就是最少边数距离，并可用前驱数组恢复路径。
  key_points:
  - BFS 用队列保存已发现但尚未展开的顶点，按距离层次访问。
  - 顶点入队时立即标记已访问，避免同一顶点被多个邻居重复加入。
  - 在无权图中首次到达顶点的层数就是最少边数距离，并可用前驱数组恢复路径。
  common_mistakes:
  - 顶点出队时才标记，造成队列中大量重复顶点。
  - 图不连通时只从一个起点运行却宣称遍历了整张图。
  examples:
  - 示例：从0出发，先将0入队；弹出0后把所有未访问邻点标记并依次入队。
  learning_sequence:
  - title: "OpenDSA：图遍历导读 · 原文与边界"
    content: "访问标记有两个任务：防止环导致重复展开，以及帮助发现尚未遍历的分量。单个起点只能访问从它可达的顶点；若要覆盖全图，还需依次选择未访问顶点作为新起点。\n\n推演任务：用含一个环和一个孤立点的图，分别记录 BFS 的队列、DFS 的调用栈或显式栈。BFS 在发现顶点、入队时标记，可避免同一顶点反复入队。\n\n本平台固定邻接点顺序以便复现；不同合法邻接顺序可能产生不同遍历序列。O(V+E) 的全图遍历时间依赖邻接表等适当表示，邻接矩阵扫描通常为 O(V²)。BFS 按边数得到的最短路结论针对无权图，不能直接替代带权最短路。\n\n改编来源：[OpenDSA：图遍历导读](https://github.com/OpenDSA/OpenDSA/blob/cf5f5d9fc0e2743a6664777ab35adae79ab5b121/RST/en/Graph/GraphTraversal.rst)，Cliff Shaffer / OpenDSA Project Contributors，版本 cf5f5d9。许可：[MIT](https://github.com/OpenDSA/OpenDSA/blob/cf5f5d9fc0e2743a6664777ab35adae79ab5b121/MIT-license.txt)。本段由词元研究所借助 AI 重写导读、练习任务和边界说明，待教师审核；不表示原作者认可本平台。完整版权与许可见课程包 sources/OPENDSA-LICENSE.txt。"
  - title: "对有环且不连通的图做 BFS，求从 0 出发的访问顺序和最少边数。"
    content: "0 入队时标记距离 0，展开后发现 1、2，距离均为 1。"
  - title: "跟踪状态变化"
    content: "从 1 发现 3 并立即标记；随后展开 2 时不会把 3 再次入队。\n\n4 是孤立点，距离保持 -1；访问序列只有 0、1、2、3。"
  - title: "边界与迁移"
    content: "邻接表遍历为 O(V+E)，额外空间 O(V)；最少边数只适用于无权或等权图。"
  worked_example:
    problem: "对有环且不连通的图做 BFS，求从 0 出发的访问顺序和最少边数。"
    steps:
    - "0 入队时标记距离 0，展开后发现 1、2，距离均为 1。"
    - "从 1 发现 3 并立即标记；随后展开 2 时不会把 3 再次入队。"
    - "4 是孤立点，距离保持 -1；访问序列只有 0、1、2、3。"
    code: "from collections import deque\ngraph = [[1, 2], [0, 3], [0, 3], [1, 2], []]\ndistance = [-1] * len(graph)\ndistance[0] = 0\nqueue = deque([0])\norder = []\nwhile queue:\n    u = queue.popleft()\n    order.append(u)\n    for v in graph[u]:\n        if distance[v] == -1:\n            distance[v] = distance[u] + 1\n            queue.append(v)\nprint(order)\nprint(distance)\n"
    reflection: "邻接表遍历为 O(V+E)，额外空间 O(V)；最少边数只适用于无权或等权图。"
  checkpoint:
    prompt: "如果直到出队才标记，同一层的两个顶点会不会重复加入共同邻居？"
    guidance: "先写下预测，再对照例题和交互实验；随堂练习提交后才形成评分证据。"
