id: DS-STACK-01
title: 栈及其不变量
course: data_structures
schema_version: 0.1.0
version: 5
difficulty: beginner
estimated_minutes: 30
prerequisites:
- DS-LINEAR-01
learning_objectives:
- 用栈追踪尚未匹配的左括号，说明后进先出的必要性
- 覆盖空串、类型不匹配、提前闭合和遗留左括号四类情况
concepts:
- 栈
- 后进先出
- 括号
lesson:
  summary: 实现后进先出操作并维护栈顶边界。关键要点包括：栈只在同一端压入和弹出，保持后进先出顺序；数组实现维护 top 边界，链式实现维护栈顶结点；空栈弹出必须有明确策略；调用栈、括号匹配和深度优先过程都依赖尚未完成任务的逆序恢复。
  key_points:
  - 栈只在同一端压入和弹出，保持后进先出顺序。
  - 数组实现维护 top 边界，链式实现维护栈顶结点；空栈弹出必须有明确策略。
  - 调用栈、括号匹配和深度优先过程都依赖尚未完成任务的逆序恢复。
  common_mistakes:
  - 遇到任意右括号都只弹栈，不检查括号类型。
  - 空栈时仍读取栈顶元素。
  examples:
  - 示例：扫描 '([])' 时遇到左括号压栈，右括号必须与当前栈顶类型匹配。
  learning_sequence:
  - title: "课外阅读 · Hello 算法"
    content: "可以前往 [Hello 算法固定版本](https://github.com/krahets/hello-algo/tree/28c1e74c1d3594fca7cc41b78a6bd18b700c5ce9) 自主阅读。该资源采用 CC-BY-NC-SA-4.0；这里只提供外链，没有导入其正文、代码或图示，也不作为本平台既有例题的出处。"
  - title: "OpenDSA：顺序栈导读 · 原文与边界"
    content: "栈只允许在同一端插入和移除。先约定 top 表示下一次写入位置，则元素数就是 top：入栈先检查容量，再写入并递增；出栈先检查非空，再递减并读取。\n\n推演任务：容量为 3，从空栈执行 push(6)、push(9)、pop()、push(2)，每一步同时记录数组、top 和返回值。最后继续 pop，指出何时开始应报告空栈。\n\n衔接：本平台使用自己的步骤演示和判定器，没有嵌入 OpenDSA 的 Java/JSAV 运行时。比较它的 push/pop 分步教学，再回到交互实验验证你画出的轨迹。\n\n改编来源：[OpenDSA：顺序栈导读](https://github.com/OpenDSA/OpenDSA/blob/cf5f5d9fc0e2743a6664777ab35adae79ab5b121/RST/en/List/StackArray.rst)，Cliff Shaffer / OpenDSA Project Contributors，版本 cf5f5d9。许可：[MIT](https://github.com/OpenDSA/OpenDSA/blob/cf5f5d9fc0e2743a6664777ab35adae79ab5b121/MIT-license.txt)。本段由词元研究所借助 AI 重写导读、练习任务和边界说明，待教师审核；不表示原作者认可本平台。完整版权与许可见课程包 sources/OPENDSA-LICENSE.txt。"
  - title: "用栈保存尚未匹配的左括号，判断嵌套结构。"
    content: "遇到 ( 和 [ 后栈为 ['(', '[']，后打开的括号必须先闭合。"
  - title: "跟踪状态变化"
    content: "读到 ] 时取出 [，读到 ) 时取出 (；整串结束还需检查栈是否为空。\n\n对于 ([)]，遇到 ) 时栈顶是 [，立刻失败；空串无需入栈，结果为真。"
  - title: "边界与迁移"
    content: "时间 O(n)，最坏空间 O(n)；空栈取顶和遗留左括号都必须检查。"
  worked_example:
    problem: "用栈保存尚未匹配的左括号，判断嵌套结构。"
    steps:
    - "遇到 ( 和 [ 后栈为 ['(', '[']，后打开的括号必须先闭合。"
    - "读到 ] 时取出 [，读到 ) 时取出 (；整串结束还需检查栈是否为空。"
    - "对于 ([)]，遇到 ) 时栈顶是 [，立刻失败；空串无需入栈，结果为真。"
    code: "def balanced(text):\n    stack = []\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    for ch in text:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n        else:\n            return False\n    return not stack\n\nprint(balanced(\"([]){}\"))\nprint(balanced(\"([)]\"))\nprint(balanced(\"\"))\n"
    reflection: "时间 O(n)，最坏空间 O(n)；空栈取顶和遗留左括号都必须检查。"
  checkpoint:
    prompt: "只检查左右括号数量相等，能区分 () 和 )( 吗？"
    guidance: "先写下预测，再对照例题和交互实验；随堂练习提交后才形成评分证据。"
