id: DS-DESIGN-01
title: 分治、贪心与动态规划辨析
course: data_structures
schema_version: 0.1.0
version: 3
difficulty: advanced
estimated_minutes: 30
prerequisites:
- DS-FOUND-04
learning_objectives:
- 能判断与“分治、贪心与动态规划辨析”有关的合法操作、适用条件和结果
- 能根据给定输入推演“分治、贪心与动态规划辨析”的关键状态并验证边界
concepts:
- 分治、贪心与动态规划辨析
- 边界条件
- 可验证性
lesson:
  summary: 依据子问题结构和选择性质匹配算法范式。关键要点包括：分治把问题拆成相互独立的同类子问题并合并结果，分析时应写出子问题规模与合并成本；贪心算法每步作局部选择，必须用交换论证、切分性质等证明该选择可扩展为全局最优；动态规划适合具有最优子结构和重叠子问题的任务，需要定义状态、转移、边界和计算顺序。
  key_points:
  - 分治把问题拆成相互独立的同类子问题并合并结果，分析时应写出子问题规模与合并成本。
  - 贪心算法每步作局部选择，必须用交换论证、切分性质等证明该选择可扩展为全局最优。
  - 动态规划适合具有最优子结构和重叠子问题的任务，需要定义状态、转移、边界和计算顺序。
  common_mistakes:
  - 误以为只要每一步选择当前数值最大或最小的方案，贪心算法就必然得到全局最优解。
  - 误以为动态规划只需写出递归函数，无需定义状态含义和初始化边界。
  examples:
  - 比较示例：归并排序按分治合并独立子段；0/1 背包通常用 dp[i][w] 表示前 i 件物品在容量 w 下的最优值。
