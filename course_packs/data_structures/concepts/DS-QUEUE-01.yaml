id: DS-QUEUE-01
title: 队列及其不变量
course: data_structures
schema_version: 0.1.0
version: 2
difficulty: beginner
estimated_minutes: 30
prerequisites:
- DS-LINEAR-01
learning_objectives:
- 能够解释队列及其不变量的核心规则
- 能够运用队列及其不变量解决边界明确的问题
concepts:
- 队列及其不变量
- 边界条件
- 可验证性
lesson:
  summary: 实现先进先出操作并维护队首队尾。 本节围绕“队列及其不变量”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 实现先进先出操作并维护队首队尾。
  - 使用“队列及其不变量”时必须写清输入、状态和失败条件，不能只记语法或模板。
  - 通过“队列及其不变量”的关联练习分别验证常规输入、边界输入和错误输入。
  common_mistakes:
  - 忽略“队列及其不变量”的适用前提，直接套用结论或代码模板。
  - 完成“队列及其不变量”实现后只检查一个正常样例，没有验证边界和失败路径。
  examples:
  - 关联练习示例：输入“5 / push 3 / push 8 / pop / pop / pop”时，预期输出“3 / 8 / EMPTY”。
assessment_ids:
- DS-QUEUE-01-C1
