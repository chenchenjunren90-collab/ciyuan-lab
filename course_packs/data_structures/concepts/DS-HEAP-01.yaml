id: DS-HEAP-01
title: 二叉堆
course: data_structures
schema_version: 0.1.0
version: 2
difficulty: intermediate
estimated_minutes: 30
prerequisites:
- DS-TREE-01
learning_objectives:
- 能够解释二叉堆的核心规则
- 能够运用二叉堆解决边界明确的问题
concepts:
- 二叉堆
- 边界条件
- 可验证性
lesson:
  summary: 用完全二叉树数组表示维护堆序。 本节围绕“二叉堆”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 用完全二叉树数组表示维护堆序。
  - 使用“二叉堆”时必须写清输入、状态和失败条件，不能只记语法或模板。
  - 通过“二叉堆”的关联练习分别验证常规输入、边界输入和错误输入。
  common_mistakes:
  - 忽略“二叉堆”的适用前提，直接套用结论或代码模板。
  - 完成“二叉堆”实现后只检查一个正常样例，没有验证边界和失败路径。
  examples:
  - 示例：为“二叉堆”写出一个最小正常样例和一个边界样例，并逐步记录状态变化。
assessment_ids:
- DS-HEAP-01-Q1
