id: DS-QUEUE-03
title: 双端队列
course: data_structures
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 30
prerequisites:
- DS-QUEUE-02
learning_objectives:
- 能判断与“双端队列”有关的合法操作、适用条件和结果
- 能根据给定输入推演“双端队列”的关键状态并验证边界
concepts:
- 双端队列
- 边界条件
- 可验证性
lesson:
  summary: 在两端进行受控插入删除并识别典型应用。关键要点包括：双端队列允许在两端插入和删除，数组循环缓冲区或双向链表都可实现端点 O(1) 操作；两端索引与空满状态必须采用一致约定，避免最后一个元素删除后状态歧义；单调双端队列可维护滑动窗口候选值，每个元素最多进出一次而达到
    O(n)。
  key_points:
  - 双端队列允许在两端插入和删除，数组循环缓冲区或双向链表都可实现端点 O(1) 操作。
  - 两端索引与空满状态必须采用一致约定，避免最后一个元素删除后状态歧义。
  - 单调双端队列可维护滑动窗口候选值，每个元素最多进出一次而达到 O(n)。
  common_mistakes:
  - 误以为双端队列允许 O(1) 访问和删除任意中间位置，因此等价于随机访问数组。
  - 误以为用单调队列求滑动窗口最大值时，过期下标无需删除，因为值仍可能最大。
  examples:
  - 轨迹示例：push_back(2)、push_front(1)、push_back(3) 后序列为 [1,2,3]，pop_back 返回3。
