id: DS-HEAP-02
title: 优先队列
course: data_structures
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 30
prerequisites:
- DS-HEAP-01
learning_objectives:
- 能判断与“优先队列”有关的合法操作、适用条件和结果
- 能根据给定输入推演“优先队列”的关键状态并验证边界
concepts:
- 优先队列
- 边界条件
- 可验证性
lesson:
  summary: 使用堆实现高效最值访问和动态调度。关键要点包括：优先队列按优先级访问元素而不是按插入先后；二叉堆可实现 peek O(1)、插入和删除堆顶 O(log n)；更新优先级后应按变化方向执行上浮或下沉，恢复堆序不变量；相同优先级的元素默认不保证稳定顺序；需要稳定性时应加入单调序号作为次关键字。
  key_points:
  - 优先队列按优先级访问元素而不是按插入先后；二叉堆可实现 peek O(1)、插入和删除堆顶 O(log n)。
  - 更新优先级后应按变化方向执行上浮或下沉，恢复堆序不变量。
  - 相同优先级的元素默认不保证稳定顺序；需要稳定性时应加入单调序号作为次关键字。
  common_mistakes:
  - 误以为优先队列总是先进先出，因此与普通队列的出队顺序完全一致。
  - 误以为二叉堆删除任意内部元素都是 O(1)，无需定位或调整。
  examples:
  - 轨迹示例：依次插入优先级 4、1、3 到最小堆，peek 返回 1；删除后堆顶变为 3。
