id: DS-HASH-02
title: 冲突处理与扩容
course: data_structures
schema_version: 0.1.0
version: 2
difficulty: advanced
estimated_minutes: 30
prerequisites:
- DS-HASH-01
learning_objectives:
- 能够解释冲突处理与扩容的核心规则
- 能够运用冲突处理与扩容解决边界明确的问题
concepts:
- 冲突处理与扩容
- 边界条件
- 可验证性
lesson:
  summary: 比较链地址和开放寻址并设计扩容策略。 本节围绕“冲突处理与扩容”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 比较链地址和开放寻址并设计扩容策略。
  - 使用“冲突处理与扩容”时必须写清输入、状态和失败条件，不能只记语法或模板。
  - 通过“冲突处理与扩容”的关联练习分别验证常规输入、边界输入和错误输入。
  common_mistakes:
  - 忽略“冲突处理与扩容”的适用前提，直接套用结论或代码模板。
  - 完成“冲突处理与扩容”实现后只检查一个正常样例，没有验证边界和失败路径。
  examples:
  - 示例：为“冲突处理与扩容”写出一个最小正常样例和一个边界样例，并逐步记录状态变化。
assessment_ids:
- DS-HASH-02-Q1
