id: DS-FOUND-02
title: 算法成本与输入规模
course: data_structures
schema_version: 0.1.0
version: 2
difficulty: beginner
estimated_minutes: 30
prerequisites:
- DS-FOUND-01
learning_objectives:
- 能够解释算法成本与输入规模的核心规则
- 能够运用算法成本与输入规模解决边界明确的问题
concepts:
- 算法成本与输入规模
- 边界条件
- 可验证性
lesson:
  summary: 选择基本操作并建立关于输入规模的成本模型。 本节围绕“算法成本与输入规模”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 先选择输入规模 n 和能够代表主要开销的基本操作，再统计其执行次数。
  - 最坏、平均和最好情况回答不同问题，分析时必须声明采用哪一种。
  - 时间和额外空间分别建模，不能用一次小规模计时直接代替增长率分析。
  common_mistakes:
  - 只统计源代码行数而忽略循环执行次数。
  - 把某台电脑的一次运行毫秒数直接写成算法复杂度。
  examples:
  - 示例：顺序查找最坏情况下比较 n 次，因此时间随输入长度线性增长。
