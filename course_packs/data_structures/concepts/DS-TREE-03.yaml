id: DS-TREE-03
title: 二叉搜索树
course: data_structures
schema_version: 0.1.0
version: 2
difficulty: intermediate
estimated_minutes: 30
prerequisites:
- DS-TREE-02
learning_objectives:
- 能够解释二叉搜索树的核心规则
- 能够运用二叉搜索树解决边界明确的问题
concepts:
- 二叉搜索树
- 边界条件
- 可验证性
lesson:
  summary: 维护左小右大的查找不变量并处理删除情形。 本节围绕“二叉搜索树”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 维护左小右大的查找不变量并处理删除情形。
  - 使用“二叉搜索树”时必须写清输入、状态和失败条件，不能只记语法或模板。
  - 通过“二叉搜索树”的关联练习分别验证常规输入、边界输入和错误输入。
  common_mistakes:
  - 忽略“二叉搜索树”的适用前提，直接套用结论或代码模板。
  - 完成“二叉搜索树”实现后只检查一个正常样例，没有验证边界和失败路径。
  examples:
  - 关联练习示例：输入“5 / 4 2 5 1 3”时，预期输出“1 2 3 4 5”。
assessment_ids:
- DS-TREE-03-C1
