id: DS-TREE-01
title: 树、结点关系与基本术语
course: data_structures
schema_version: 0.1.0
version: 2
difficulty: beginner
estimated_minutes: 30
prerequisites:
- DS-FOUND-01
learning_objectives:
- 能够解释树、结点关系与基本术语的核心规则
- 能够运用树、结点关系与基本术语解决边界明确的问题
concepts:
- 树、结点关系与基本术语
- 边界条件
- 可验证性
lesson:
  summary: 描述根、父子、深度、高度和子树。 本节围绕“树、结点关系与基本术语”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 描述根、父子、深度、高度和子树。
  - 使用“树、结点关系与基本术语”时必须写清输入、状态和失败条件，不能只记语法或模板。
  - 通过“树、结点关系与基本术语”的关联练习分别验证常规输入、边界输入和错误输入。
  common_mistakes:
  - 忽略“树、结点关系与基本术语”的适用前提，直接套用结论或代码模板。
  - 完成“树、结点关系与基本术语”实现后只检查一个正常样例，没有验证边界和失败路径。
  examples:
  - 示例：为“树、结点关系与基本术语”写出一个最小正常样例和一个边界样例，并逐步记录状态变化。
assessment_ids:
