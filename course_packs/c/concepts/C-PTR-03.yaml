id: C-PTR-03
title: 指针参数与输出参数
course: c
schema_version: 0.1.0
version: 2
difficulty: intermediate
estimated_minutes: 30
prerequisites:
- C-FUNC-02
learning_objectives:
- 能够解释指针参数与输出参数的核心规则
- 能够运用指针参数与输出参数解决边界明确的问题
concepts:
- 指针参数与输出参数
- 边界条件
- 可验证性
lesson:
  summary: 通过指针参数修改调用方对象并检查空指针。 本节围绕“指针参数与输出参数”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 通过指针参数修改调用方对象并检查空指针。
  - 使用“指针参数与输出参数”时必须写清输入、状态和失败条件，不能只记语法或模板。
  - 通过“指针参数与输出参数”的关联练习分别验证常规输入、边界输入和错误输入。
  common_mistakes:
  - 忽略“指针参数与输出参数”的适用前提，直接套用结论或代码模板。
  - 完成“指针参数与输出参数”实现后只检查一个正常样例，没有验证边界和失败路径。
  examples:
  - 示例：为“指针参数与输出参数”写出一个最小正常样例和一个边界样例，并逐步记录状态变化。
assessment_ids:
