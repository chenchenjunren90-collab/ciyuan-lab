id: C-TYPE-02
title: 结构体数组、嵌套与指针
course: c
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 30
prerequisites:
- C-TYPE-01
learning_objectives:
- 能判断与“结构体数组、嵌套与指针”有关的合法操作、适用条件和结果
- 能根据给定输入推演“结构体数组、嵌套与指针”的关键状态并验证边界
concepts:
- 结构体数组、嵌套与指针
- 边界条件
- 可验证性
lesson:
  summary: 组织记录集合并正确使用箭头运算符。关键要点包括：结构体数组连续存放完整结构体元素，成员之间可能存在为对齐插入的填充字节；结构体指针通过 p->member 访问成员，等价于 (*p).member，但必须保证 p 有效；嵌套结构体和浅拷贝会逐成员复制；含指针成员时不会自动复制其指向资源。
  key_points:
  - 结构体数组连续存放完整结构体元素，成员之间可能存在为对齐插入的填充字节。
  - 结构体指针通过 p->member 访问成员，等价于 (*p).member，但必须保证 p 有效。
  - 嵌套结构体和浅拷贝会逐成员复制；含指针成员时不会自动复制其指向资源。
  common_mistakes:
  - 误以为结构体大小始终等于所有成员 sizeof 之和，不可能包含填充。
  - 误以为复制含 char * 成员的结构体时，C 会自动复制字符串内容并建立独立所有权。
  examples:
  - 代码片段：struct Point{int x,y;}; struct Point pts[2]={{1,2},{3,4}}; pts[1].x 的值为 3。
assessment_ids:
