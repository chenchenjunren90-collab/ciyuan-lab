id: C-ARRAY-01
title: 一维数组
course: c
schema_version: 0.1.0
version: 2
difficulty: beginner
estimated_minutes: 30
prerequisites:
- C-CTRL-04
learning_objectives:
- 能够解释一维数组的核心规则
- 能够运用一维数组解决边界明确的问题
concepts:
- 一维数组
- 边界条件
- 可验证性
lesson:
  summary: 按连续同类型元素建模并安全控制下标范围。 本节围绕“一维数组”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 数组在创建时确定元素类型和长度，合法下标范围始终是 0 到 n-1。
  - 数组作为函数实参时通常退化为首元素指针，因此长度必须通过独立参数传递。
  - 初始化、遍历和聚合都要先处理空序列约定，再维护当前已处理区间的不变量。
  common_mistakes:
  - 使用 sizeof(形参数组) 推断调用方数组长度，实际得到的是指针大小。
  - 循环访问 a[n] 或在 n 为 0 时直接读取 a[0]。
  examples:
  - 代码示例：int max = a[0]; for (size_t i = 1; i < n; ++i) if (a[i] > max) max = a[i];
assessment_ids:
- C-ARRAY-01-C1
