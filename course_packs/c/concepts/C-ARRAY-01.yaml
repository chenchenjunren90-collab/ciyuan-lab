id: C-ARRAY-01
title: 一维数组
course: c
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 30
prerequisites:
- C-CTRL-04
learning_objectives:
- 能判断与“一维数组”有关的合法操作、适用条件和结果
- 能根据给定输入推演“一维数组”的关键状态并验证边界
concepts:
- 一维数组
- 边界条件
- 可验证性
lesson:
  summary: 按连续同类型元素建模并安全控制下标范围。关键要点包括：一维数组在创建时确定元素类型和长度，合法下标范围是 0 到 n-1；数组表达式传入函数时通常转换为首元素指针，因此长度必须通过独立参数或结构一并传递；聚合操作在读取 a[0]
    前必须先定义并处理 n==0 的空序列结果。
  key_points:
  - 一维数组在创建时确定元素类型和长度，合法下标范围是 0 到 n-1。
  - 数组表达式传入函数时通常转换为首元素指针，因此长度必须通过独立参数或结构一并传递。
  - 聚合操作在读取 a[0] 前必须先定义并处理 n==0 的空序列结果。
  common_mistakes:
  - 误以为函数形参数组中使用 sizeof 可以恢复调用者数组的元素个数。
  - 误以为长度为 n 的数组可以访问 a[n]，因为 n 表示最后一个元素位置。
  examples:
  - 代码片段：if(n==0){puts("empty");}else{int max=a[0]; for(size_t i=1;i<n;++i) if(a[i]>max) max=a[i]; printf("%d\n",max);}；空数组先输出
    empty，不读取 a[0]。
