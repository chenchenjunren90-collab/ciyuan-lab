id: C-MEM-01
title: 动态内存分配
course: c
schema_version: 0.1.0
version: 5
difficulty: intermediate
estimated_minutes: 30
prerequisites:
- C-PTR-01
learning_objectives:
- 根据元素数量申请空间，检查分配结果后再写入和读取
- 明确内存所有权，正确释放并识别未初始化读取与释放后访问
concepts:
- malloc
- free
- 内存
lesson:
  summary: 使用 malloc/calloc 获取堆内存并检查失败。关键要点包括：malloc 返回未初始化的动态存储，calloc 会把分配字节置零，但都可能失败；分配大小应以元素数量乘 sizeof *ptr 计算，并在乘法前防止整数溢出；每块成功分配的内存必须有明确所有者和唯一释放路径，失败分支同样要清理。
  key_points:
  - malloc 返回未初始化的动态存储，calloc 会把分配字节置零，但都可能失败。
  - 分配大小应以元素数量乘 sizeof *ptr 计算，并在乘法前防止整数溢出。
  - 每块成功分配的内存必须有明确所有者和唯一释放路径，失败分支同样要清理。
  common_mistakes:
  - 写成 malloc(n) 却按 n 个 int 使用，导致分配空间不足。
  - 未检查返回值便解引用，内存不足时触发崩溃。
  examples:
  - 代码示例：int *a = malloc(n * sizeof *a); if (a == NULL) return 1; /* use */ free(a);
  learning_sequence:
  - title: "网道：动态内存导读 · 原文与边界"
    content: "malloc 申请指定字节数，失败返回空指针；成功后取得的是尚未初始化的存储空间。使用前检查申请结果，写入确定的值，再读取；最终由明确的所有者释放。\n\n动手：为 4 个 int 设计申请、检查、初始化、使用、释放五步流程。说明为什么 sizeof *p 比把一个平台上的 int 字节数写死更合适；元素数来自输入时还应检查乘法溢出。\n\n阅读修正：普通全局变量具有静态存储期，不需要也不能通过 free(&global) 释放。需要手动管理的是动态申请的存储空间，不能把“全局变量”与“堆分配”混为一谈。\n\n改编来源：[网道：动态内存导读](https://github.com/wangdoc/clang-tutorial/blob/96e02b1bfb98243703f4dced594f6893bda5565d/docs/memory.md)，网道（WangDoc）及其贡献者，版本 96e02b1。许可：[CC-BY-SA-3.0](https://creativecommons.org/licenses/by-sa/3.0/)。本段由词元研究所借助 AI 重写导读、练习任务和边界说明，待教师审核；不表示原作者认可本平台。本改编段落同以 CC-BY-SA-3.0 提供；不改变平台其他独立内容的许可。"
  - title: "申请三个整数，写入数值后求和，并沿所有失败路径清理资源。"
    content: "固定 n=3 不会使乘法溢出；一般输入必须先验证 n <= SIZE_MAX / sizeof *values。"
  - title: "跟踪状态变化"
    content: "malloc 成功后内容尚未初始化，循环先写后读，依次得到 1、2、3。\n\nfree 只调用一次；之后不再访问该块内存。设为 NULL 不会清空其他别名指针。"
  - title: "边界与迁移"
    content: "分配成功、初始化完成、生命周期仍有效是三个独立条件。"
  worked_example:
    problem: "申请三个整数，写入数值后求和，并沿所有失败路径清理资源。"
    steps:
    - "固定 n=3 不会使乘法溢出；一般输入必须先验证 n <= SIZE_MAX / sizeof *values。"
    - "malloc 成功后内容尚未初始化，循环先写后读，依次得到 1、2、3。"
    - "free 只调用一次；之后不再访问该块内存。设为 NULL 不会清空其他别名指针。"
    code: "#include <stdio.h>\n#include <stdlib.h>\nint main(void) {\n    const size_t n = 3;\n    int *values = malloc(n * sizeof *values);\n    if (values == NULL) return 1;\n    int sum = 0;\n    for (size_t i = 0; i < n; ++i) {\n        values[i] = (int)i + 1;\n        sum += values[i];\n    }\n    printf(\"%d\\n\", sum);\n    free(values);\n    values = NULL;\n    return 0;\n}\n"
    reflection: "分配成功、初始化完成、生命周期仍有效是三个独立条件。"
  checkpoint:
    prompt: "malloc 成功是否意味着 values[0] 已经是 0？"
    guidance: "先写下预测，再对照例题和交互实验；随堂练习提交后才形成评分证据。"
