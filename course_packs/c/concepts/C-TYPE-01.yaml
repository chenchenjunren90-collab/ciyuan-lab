id: C-TYPE-01
title: 结构体定义与成员访问
course: c
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 30
prerequisites:
- C-ARRAY-01
learning_objectives:
- 能够解释结构体定义与成员访问的核心规则
- 能够运用结构体定义与成员访问解决边界明确的问题
concepts:
- 结构体定义与成员访问
- 边界条件
- 可验证性
lesson:
  summary: 使用结构体组合相关字段并通过点运算符访问。关键要点包括：结构体把不同类型但属于同一实体的字段组合为一个对象；普通对象使用点运算符访问成员，结构体指针使用箭头运算符访问成员；初始化时明确每个字段含义，跨文件共享结构体声明时放入受保护的头文件。
  key_points:
  - 结构体把不同类型但属于同一实体的字段组合为一个对象。
  - 普通对象使用点运算符访问成员，结构体指针使用箭头运算符访问成员。
  - 初始化时明确每个字段含义，跨文件共享结构体声明时放入受保护的头文件。
  common_mistakes:
  - 复制字符串字段时忽略数组容量，覆盖相邻成员。
  - 改变结构体字段后仍按旧的二进制布局读写文件。
  examples:
  - 代码示例：struct Student { char name[16]; int score; }; struct Student s = {.name = "Li", .score = 90};
assessment_ids:
- C-TYPE-01-C1
source_refs:
- SRC-C-GUIDE-MEMORY
status: draft
