id: C-TEST-01
title: 边界测试与可验证程序设计
course: c
schema_version: 0.1.0
version: 2
difficulty: advanced
estimated_minutes: 30
prerequisites:
- C-DEBUG-01
learning_objectives:
- 能够解释边界测试与可验证程序设计的核心规则
- 能够运用边界测试与可验证程序设计解决边界明确的问题
concepts:
- 边界测试与可验证程序设计
- 边界条件
- 可验证性
lesson:
  summary: 围绕正常、边界和异常输入构造可重复测试。 本节围绕“边界测试与可验证程序设计”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 测试从接口契约推导正常、边界、无效和资源受限输入，而不是从实现细节凑样例。
  - 每个用例必须有确定输入、预期输出和失败诊断，隐藏测试不能泄露给模型或前端。
  - 回归测试记录曾经失败的最小样例，代码修改后自动验证缺陷没有重新出现。
  common_mistakes:
  - 只测试一个正常样例就宣称程序正确。
  - 让语言模型决定通过与否，而不是使用编译和确定性断言。
  examples:
  - 示例：最大值函数至少覆盖单元素、全负数、重复最大值和空输入处理约定。
