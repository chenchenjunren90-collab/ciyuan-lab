id: C-TEST-01
title: 边界测试与可验证程序设计
course: c
schema_version: 0.1.0
version: 3
difficulty: advanced
estimated_minutes: 30
prerequisites:
- C-DEBUG-01
learning_objectives:
- 能判断与“边界测试与可验证程序设计”有关的合法操作、适用条件和结果
- 能根据给定输入推演“边界测试与可验证程序设计”的关键状态并验证边界
concepts:
- 边界测试与可验证程序设计
- 边界条件
- 可验证性
lesson:
  summary: 围绕正常、边界和异常输入构造可重复测试。关键要点包括：边界测试从输入域划分等价类，并选择最小值、最大值、空值和边界两侧的代表；测试必须有确定性判定依据，分别记录输入、预期输出、实际输出和失败诊断；一个通过样例只能证明该样例未暴露错误，回归测试应覆盖此前缺陷和关键不变量。
  key_points:
  - 边界测试从输入域划分等价类，并选择最小值、最大值、空值和边界两侧的代表。
  - 测试必须有确定性判定依据，分别记录输入、预期输出、实际输出和失败诊断。
  - 一个通过样例只能证明该样例未暴露错误，回归测试应覆盖此前缺陷和关键不变量。
  common_mistakes:
  - 误以为随机运行一次没有崩溃即可证明程序对整个输入域正确。
  - 误以为边界值只包括允许范围的最大值，不需要测试空输入或边界外错误路径。
  examples:
  - 示例：验证闭区间 [0,100] 的输入检查时至少测试 -1、0、1、99、100、101，并为每项写明预期。
