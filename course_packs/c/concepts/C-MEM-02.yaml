id: C-MEM-02
title: realloc、free 与所有权
course: c
schema_version: 0.1.0
version: 3
difficulty: advanced
estimated_minutes: 30
prerequisites:
- C-MEM-01
learning_objectives:
- 能判断与“realloc、free 与所有权”有关的合法操作、适用条件和结果
- 能根据给定输入推演“realloc、free 与所有权”的关键状态并验证边界
concepts:
- realloc、free 与所有权
- 边界条件
- 可验证性
lesson:
  summary: 维护内存所有权，避免泄漏、重复释放和悬空指针。关键要点包括：realloc 成功后旧指针不再可用，失败时返回 NULL 且原内存块仍保持有效；应先把 realloc 结果保存到临时指针，确认成功后再更新所有权变量；每个成功分配的内存块应有唯一清晰的释放责任，free
    后不得再次解引用或重复释放。
  key_points:
  - realloc 成功后旧指针不再可用，失败时返回 NULL 且原内存块仍保持有效。
  - 应先把 realloc 结果保存到临时指针，确认成功后再更新所有权变量。
  - 每个成功分配的内存块应有唯一清晰的释放责任，free 后不得再次解引用或重复释放。
  common_mistakes:
  - 误以为可以直接写 p=realloc(p,n)，因为失败时 p 仍会自动指向原内存块。
  - 误以为free(p) 会自动把变量 p 设置为 NULL，因此后续无需处理悬空指针。
  examples:
  - 代码片段：int *tmp=realloc(p,new_n*sizeof *p); if(tmp){p=tmp;} else {/* p 仍有效，处理失败 */}
