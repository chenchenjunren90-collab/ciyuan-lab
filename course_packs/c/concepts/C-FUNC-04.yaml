id: C-FUNC-04
title: 递归与终止条件
course: c
schema_version: 0.1.0
version: 3
difficulty: intermediate
estimated_minutes: 30
prerequisites:
- C-FUNC-02
learning_objectives:
- 能判断与“递归与终止条件”有关的合法操作、适用条件和结果
- 能根据给定输入推演“递归与终止条件”的关键状态并验证边界
concepts:
- 递归与终止条件
- 边界条件
- 可验证性
lesson:
  summary: 设计具有规模递减和明确终止条件的递归函数。关键要点包括：递归函数必须有可到达的基例，并让每次递归调用都缩小问题规模；每层调用拥有独立的自动局部状态，调用深度同时决定额外栈空间成本；验证递归应覆盖基例、基例相邻输入和较深输入，并检查返回阶段的组合逻辑。
  key_points:
  - 递归函数必须有可到达的基例，并让每次递归调用都缩小问题规模。
  - 每层调用拥有独立的自动局部状态，调用深度同时决定额外栈空间成本。
  - 验证递归应覆盖基例、基例相邻输入和较深输入，并检查返回阶段的组合逻辑。
  common_mistakes:
  - 误以为只要函数体中出现对自身的调用，编译器就会自动推导终止条件。
  - 误以为递归与迭代的空间成本必然相同，因为两者执行的计算步骤相似。
  examples:
  - 轨迹示例：factorial(3) 展开为 3*factorial(2)，再到 2*factorial(1)，基例返回 1 后逐层得到 6。
