id: C-BASE-01
title: C 程序结构与编译运行
course: c
schema_version: 0.1.0
version: 5
difficulty: beginner
estimated_minutes: 30
prerequisites: []
learning_objectives:
- 区分预处理、编译、汇编、链接和执行，定位报错所在阶段
- 编译带标准头文件的最小程序，用输出和退出状态检查结果
concepts:
- main
- 编译
- 链接
lesson:
  summary: 理解源文件、预处理、编译、汇编、链接和执行的基本流程。关键要点包括：main 是托管环境 C 程序的入口，常用合法形式为 int main(void) 或 int main(int argc, char *argv[])；源文件先经预处理和编译生成汇编表示，再由汇编器形成目标文件，最后由链接器解析跨文件符号并生成可执行程序；编译成功不代表行为正确；警告、链接错误、退出状态和测试结果分别提供不同证据。
  key_points:
  - main 是托管环境 C 程序的入口，常用合法形式为 int main(void) 或 int main(int argc, char *argv[])。
  - 源文件依次经过预处理、编译和汇编形成目标文件，最后由链接器解析跨文件符号并生成可执行程序。
  - 编译成功不代表行为正确；警告、链接错误、退出状态和测试结果分别提供不同证据。
  common_mistakes:
  - 误以为C 程序可以把 main 声明为 void main，并认为所有标准实现都会接受且行为一致。
  - 误以为只要单个源文件编译成功，链接阶段就不会再出现未定义引用或重复定义。
  - 把语法或类型错误、未定义符号和运行时错误都笼统称为“编译错误”，导致定位阶段错误。
  examples:
  - 命令示例：gcc -std=c17 -Wall -Wextra main.c util.c -o app；若 util.c 未定义已声明的函数，链接阶段会报告未定义引用。
  learning_sequence:
  - title: "从源文件到输出：编译一个打印 7 的最小程序。"
    content: "#include 引入头文件，其中提供标准输入输出接口声明；main 是程序入口。"
  - title: "跟踪状态变化"
    content: "编译器检查语法和类型，链接器解析 printf 等外部符号；编译通过并不证明逻辑正确。\n\n3 + 4 产生整数 7，%d 与 int 参数匹配；\\n 结束输出行。"
  - title: "边界与迁移"
    content: "语法或声明问题依赖编译诊断；算法错误仍需要测试。建议使用 -std=c17 -Wall -Wextra -Wpedantic。"
  worked_example:
    problem: "从源文件到输出：编译一个打印 7 的最小程序。"
    steps:
    - "#include 引入头文件，其中提供标准输入输出接口声明；main 是程序入口。"
    - "编译器检查语法和类型，链接器解析 printf 等外部符号；编译通过并不证明逻辑正确。"
    - "3 + 4 产生整数 7，%d 与 int 参数匹配；\\n 结束输出行。"
    code: "#include <stdio.h>\nint main(void) {\n    int value = 3 + 4;\n    printf(\"%d\\n\", value);\n    return 0;\n}\n"
    reflection: "语法或声明问题依赖编译诊断；算法错误仍需要测试。建议使用 -std=c17 -Wall -Wextra -Wpedantic。"
  checkpoint:
    prompt: "漏掉 stdio.h 与把 3 + 4 写成 3 - 4，分别可能在哪个阶段发现？"
    guidance: "先写下预测，再对照例题和交互实验；随堂练习提交后才形成评分证据。"
