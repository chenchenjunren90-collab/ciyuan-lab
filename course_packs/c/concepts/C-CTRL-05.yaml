id: C-CTRL-05
title: break、continue 与循环边界
course: c
schema_version: 0.1.0
version: 3
difficulty: beginner
estimated_minutes: 30
prerequisites:
- C-CTRL-04
learning_objectives:
- 能判断与“break、continue 与循环边界”有关的合法操作、适用条件和结果
- 能根据给定输入推演“break、continue 与循环边界”的关键状态并验证边界
concepts:
- break、continue 与循环边界
- 边界条件
- 可验证性
lesson:
  summary: 控制循环提前结束与跳过，并验证边界条件。关键要点包括：break 只终止其所在的最内层循环或 switch，不会自动退出外层循环；continue 跳过本轮剩余语句；在 for 中随后执行更新表达式，在 while 中直接回到条件判断；使用控制转移前应确认更新逻辑不会被跳过，否则可能造成遗漏或死循环。
  key_points:
  - break 只终止其所在的最内层循环或 switch，不会自动退出外层循环。
  - continue 跳过本轮剩余语句；在 for 中随后执行更新表达式，在 while 中直接回到条件判断。
  - 使用控制转移前应确认更新逻辑不会被跳过，否则可能造成遗漏或死循环。
  common_mistakes:
  - 误以为嵌套循环内执行一次 break 会同时终止所有外层循环。
  - 误以为while 循环中的 continue 会自动执行写在循环体末尾的计数器更新。
  examples:
  - 代码片段：for(int i=0;i<5;++i){if(i==2) continue; if(i==4) break; printf("%d ",i);} 输出 0 1 3。
