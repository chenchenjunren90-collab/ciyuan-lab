id: C-PTR-01
title: 指针、地址与解引用
course: c
schema_version: 0.1.0
version: 5
difficulty: beginner
estimated_minutes: 30
prerequisites:
- C-BASE-03
learning_objectives:
- 用对象与地址的对应关系解释 &、* 和指针赋值
- 实现带临时变量的指针交换，识别空指针和悬空指针的风险
concepts:
- 地址
- 解引用
- 指针
lesson:
  summary: 理解指针保存地址以及解引用访问对象的含义。关键要点包括：取地址运算符 & 获得对象地址，指针变量保存兼容类型的地址，*p 访问所指对象；解引用前必须证明指针非空、指向仍处于生命周期内且满足对齐与类型要求；修改调用方对象时传入其地址，同时用清晰命名和
    const 标注读写意图。
  key_points:
  - 取地址运算符 & 获得对象地址，指针变量保存兼容类型的地址，*p 访问所指对象。
  - 解引用前必须证明指针非空、指向仍处于生命周期内且满足对齐与类型要求。
  - 修改调用方对象时传入其地址，同时用清晰命名和 const 标注读写意图。
  common_mistakes:
  - 未初始化指针就执行 *p = 1，向不确定地址写入。
  - 返回局部变量地址，函数结束后指针立即悬空。
  examples:
  - 代码示例：void swap(int *a, int *b) { int t = *a; *a = *b; *b = t; }
  learning_sequence:
  - title: "网道：指针导读 · 原文与边界"
    content: "先区分三个对象：变量 x、保存 &x 的指针 p、表达式 *p 所访问的对象。把地址传给函数时，形参仍是指针值的副本；通过副本访问同一个有效对象，才会改变调用者的数据。\n\n阅读边界：指针不是 C 语言中的整数类型。指针加减整数只在同一数组及其尾后位置范围内有定义，尾后位置不能解引用；两个指针相减还要求它们来自同一数组，结果可由 ptrdiff_t 表示。不能用任意数字地址练习指针运算。\n\n动手：画出 int a[3]={4,8,12}; int *p=a; 的关系图，比较 p+1 与 *p+1。再预测 *(p+2)，并解释为什么 *(p+3) 不合法。\n\n改编来源：[网道：指针导读](https://github.com/wangdoc/clang-tutorial/blob/96e02b1bfb98243703f4dced594f6893bda5565d/docs/pointer.md)，网道（WangDoc）及其贡献者，版本 96e02b1。许可：[CC-BY-SA-3.0](https://creativecommons.org/licenses/by-sa/3.0/)。本段由词元研究所借助 AI 重写导读、练习任务和边界说明，待教师审核；不表示原作者认可本平台。本改编段落同以 CC-BY-SA-3.0 提供；不改变平台其他独立内容的许可。"
  - title: "通过两个指针交换对象的数值，观察地址与值的区别。"
    content: "&x 和 &y 分别传入 x、y 的地址，a、b 是函数内的指针副本。"
  - title: "跟踪状态变化"
    content: "temp 先保存 x 的原值 2；*a = *b 后两个对象都暂时等于 9。\n\n*b = temp 把 2 写入 y；交换结束时 a、b 指向的对象没有改变。"
  - title: "边界与迁移"
    content: "传入非空但已失效的地址仍会出错；调用方必须保证对象生命周期。"
  worked_example:
    problem: "通过两个指针交换对象的数值，观察地址与值的区别。"
    steps:
    - "&x 和 &y 分别传入 x、y 的地址，a、b 是函数内的指针副本。"
    - "temp 先保存 x 的原值 2；*a = *b 后两个对象都暂时等于 9。"
    - "*b = temp 把 2 写入 y；交换结束时 a、b 指向的对象没有改变。"
    code: "#include <stdio.h>\nstatic void swap(int *a, int *b) {\n    if (a == NULL || b == NULL) return;\n    int temp = *a;\n    *a = *b;\n    *b = temp;\n}\nint main(void) {\n    int x = 2, y = 9;\n    swap(&x, &y);\n    printf(\"%d %d\\n\", x, y);\n    return 0;\n}\n"
    reflection: "传入非空但已失效的地址仍会出错；调用方必须保证对象生命周期。"
  checkpoint:
    prompt: "如果省略 temp 并顺序执行 *a=*b; *b=*a;，最终两个对象是什么？"
    guidance: "先写下预测，再对照例题和交互实验；随堂练习提交后才形成评分证据。"
