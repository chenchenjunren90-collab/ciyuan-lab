id: C-IO-01
title: 文本文件读写
course: c
schema_version: 0.1.0
version: 2
difficulty: intermediate
estimated_minutes: 30
prerequisites:
- C-STR-01
learning_objectives:
- 能够解释文本文件读写的核心规则
- 能够运用文本文件读写解决边界明确的问题
concepts:
- 文本文件读写
- 边界条件
- 可验证性
lesson:
  summary: 检查打开结果并用循环可靠处理文本记录。 本节围绕“文本文件读写”建立可执行的概念模型：先说明定义、适用前提和状态变化，再通过最小示例观察行为，最后用正常、边界和失败输入验证实现。学习结果以关联练习和确定性测试为准。
  key_points:
  - 检查打开结果并用循环可靠处理文本记录。
  - 使用“文本文件读写”时必须写清输入、状态和失败条件，不能只记语法或模板。
  - 通过“文本文件读写”的关联练习分别验证常规输入、边界输入和错误输入。
  common_mistakes:
  - 忽略“文本文件读写”的适用前提，直接套用结论或代码模板。
  - 完成“文本文件读写”实现后只检查一个正常样例，没有验证边界和失败路径。
  examples:
  - 关联练习示例：输入“4 / 3 9 1 5”时，预期输出“1 9”。
assessment_ids:
- C-IO-01-C1
