prompt: 关于“位运算与掩码”，下列哪项说法正确？
source_refs:
- SRC-C-GUIDE-ENGINEERING
evaluation:
  mode: exact
  options:
  - id: A
    text: 移位位数必须非负且小于提升后左操作数的位宽；对无符号数移位更容易推理。
  - id: B
    text: 表达式 1 << k 对任意 k 都有定义，超出类型位宽时会自动截断。
  - id: C
    text: 按位运算符 & 和逻辑运算符 && 可以互换，因为二者都只产生 0 或 1。
  accepted_answers:
  - A
