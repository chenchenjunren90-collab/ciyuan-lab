  "prompt": "读取正整数 n。若能被 3 整除，输出 Pling；若能被 5 整除，接着输出 Plang；若能被 7 整除，接着输出 Plong，严格按这个顺序且中间不加空格。如果三项都不满足，输出 n 本身。最后输出换行。\n\n来源：[Exercism C / raindrops](https://github.com/exercism/c/blob/0ccc17ab44048668bedc2d2cf28d4bf84f8dec42/exercises/practice/raindrops/.docs/instructions.md)（0ccc17a），Copyright (c) 2021 Exercism，[MIT](https://github.com/exercism/c/blob/0ccc17ab44048668bedc2d2cf28d4bf84f8dec42/LICENSE)。中文教学适配：词元研究所（AI 辅助），待教师审核。保留 3/5/7 的编码规则；翻译重写题面和提示，改为标准输入输出，自编覆盖全部命中组合的测试。 完整许可随课程包 sources/EXERCISM-LICENSE.txt 分发。",
