id: C-PTR-01-C1
title: 编程实践：指针、地址与解引用
course: c
schema_version: 0.1.0
version: 2
type: code
difficulty: beginner
estimated_minutes: 20
concept_ids:
- C-PTR-01
prompt: 读取两个整数，通过指针交换后按先后顺序输出。
source_refs:
- SRC-C-GUIDE-MEMORY
evaluation:
  mode: tests
  runtime:
    language: c
    version: C17
    entrypoint: main.c
    time_limit_ms: 2000
    memory_limit_mb: 128
    output_limit_kb: 64
    network_access: false
    filesystem_access: isolated
  tests:
  - id: case-1
    visibility: public
    input: '2 9

      '
    expected_output: '9 2

      '
  - id: case-2
    visibility: hidden
    input: '7 7

      '
    expected_output: '7 7

      '
  - id: case-3
    visibility: hidden
    input: '-1 3

      '
    expected_output: '3 -1

      '
  - id: hidden-zero
    visibility: hidden
    input: "0 -9\n"
    expected_output: "-9 0\n"
extensions:
  learning_stage: in_class
  audience: chinese_beginner
  input_format: 一行两个整数 a 和 b，以空白分隔。
  output_format: 输出交换后的两个整数，中间一个空格，末尾换行。
  constraints:
  - -1000000 <= a, b <= 1000000
  - 实现 swap(int *a, int *b)，调用方传入两个有效整数对象的地址。
  scaffolding:
  - 画出两个对象及分别指向它们的指针，区分地址与对象的值。
  - 覆盖第一个对象之前，需要暂存它的旧值。
  - 用相等数、负数和零检查交换结果。
  reflection_prompt: 哪条语句修改了对象的值？输出测试能检查结果，但是否使用了指针仍需代码审阅。
status: draft
