evaluation:
  mode: exact
  options:
  - id: A
    text: continue 跳过本轮剩余语句；在 for 中随后执行更新表达式，在 while 中直接回到条件判断。
  - id: B
    text: 嵌套循环内执行一次 break 会同时终止所有外层循环。
  - id: C
    text: while 循环中的 continue 会自动执行写在循环体末尾的计数器更新。
