id: C-ARRAY-01-C1
title: 编程实践：一维数组
course: c
schema_version: 0.1.0
version: 2
type: code
difficulty: beginner
estimated_minutes: 20
concept_ids:
- C-ARRAY-01
prompt: 读取 n 及 n 个整数，输出其中最大值；当 n 为 0 时输出 empty，不读取任何数组元素。
source_refs:
- SRC-C-GUIDE-MEMORY
evaluation:
  mode: tests
  runtime:
    language: c
    version: C17
    entrypoint: main.c
    time_limit_ms: 2000
    memory_limit_mb: 128
    output_limit_kb: 64
    network_access: false
    filesystem_access: isolated
  tests:
  - id: case-1
    visibility: public
    input: '5

      3 8 2 9 1

      '
    expected_output: '9

      '
  - id: case-2
    visibility: hidden
    input: '1

      -4

      '
    expected_output: '-4

      '
  - id: case-3
    visibility: hidden
    input: '4

      -8 -2 -9 -3

      '
    expected_output: '-2

      '
  - id: hidden-empty
    visibility: hidden
    input: "0\n"
    expected_output: "empty\n"
  - id: hidden-equal
    visibility: hidden
    input: "3\n5 5 5\n"
    expected_output: "5\n"
extensions:
  learning_stage: in_class
  input_format: 首行为 n；随后恰好 n 个整数，允许跨行。
  output_format: n > 0 时输出最大值；n = 0 时输出 empty。
  constraints:
  - 0 <= n <= 1000
  - 每个整数的绝对值不超过 1000000
  scaffolding:
  - 在读取第一个元素前处理 n = 0。
  - 非空时用首个元素初始化最大值，不能默认使用 0。
  - 从第二个元素逐一比较，最后一个合法下标为 n - 1。
  reflection_prompt: 输入全为负数时，初始化最大值为 0 为什么会错？
status: draft
