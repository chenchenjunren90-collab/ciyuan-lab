  "prompt": "读取一行 ASCII 文本，按字节逆序输出。输入行的换行符不参与反转；空格和标点也是内容。空行应输出空行。本题不处理中文或其他多字节字符。\n\n来源：[Exercism C / reverse-string](https://github.com/exercism/c/blob/0ccc17ab44048668bedc2d2cf28d4bf84f8dec42/exercises/practice/reverse-string/test_reverse_string.c)（0ccc17a），Copyright (c) 2021 Exercism，[MIT](https://github.com/exercism/c/blob/0ccc17ab44048668bedc2d2cf28d4bf84f8dec42/LICENSE)。中文教学适配：词元研究所（AI 辅助），待教师审核。参考 reverse 的字符串边界测试思想；改为 main.c 标准输入输出，允许原地反转，不继承原题分配返回字符串的所有权接口。 完整许可随课程包 sources/EXERCISM-LICENSE.txt 分发。",
  "source_refs": [
    "SRC-C-EXERCISM-REVERSE"
  ],
