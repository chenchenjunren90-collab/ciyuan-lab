  options:
  - id: A
    text: 在函数接口中为只读输入添加 const 可表达意图，并允许调用者传入 const 对象。
  - id: B
    text: const int *p 与 int *const p 含义完全相同，都同时禁止改指针和改对象。
  - id: C
    text: 通过强制类型转换去掉 const 后，任何对象都可以安全修改。
