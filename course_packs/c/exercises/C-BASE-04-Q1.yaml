evaluation:
  mode: exact
  options:
  - id: A
    text: scanf 写入普通变量时通常需要传入地址，并应检查返回的成功转换项数。
  - id: B
    text: printf("%d", value) 可以安全输出任意整数或浮点类型，库会自动识别实参类型。
  - id: C
    text: scanf 的返回值表示读取的字符数，因此只要返回值非零就代表整行输入完全有效。
