    text: 数组元素连续存储，任何下标或指针移动都必须留在合法对象范围。C 字符串以空字符终止，容量必须包含终止符。指针的有效性取决于所指对象的生命周期。动态内存需要明确所有权、失败检查和唯一释放点；越界、释放后使用与读取未初始化值可能导致未定义行为。
