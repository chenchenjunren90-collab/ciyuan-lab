    "content": {
      "mode": "inline",
      "text": "阅读函数时依次找出返回类型、名称、形参和函数体。调用前应有兼容的声明；return 结束当前函数调用，并在需要时把值交回调用位置。无参数原型可写成 int task(void)。\n\n动手：将“两个整数取较大值”拆成 max_value 函数和负责输入输出的 main。分别用大小相反和相等的输入解释返回位置。\n\n阅读修正：C 不支持在另一个函数体内定义普通函数，但块作用域内可以有函数声明。这里采用 hosted 环境的 int main(void)，不把它泛化到所有嵌入式启动环境。\n\n改编来源：[网道：函数导读](https://github.com/wangdoc/clang-tutorial/blob/96e02b1bfb98243703f4dced594f6893bda5565d/docs/function.md)，网道（WangDoc）及其贡献者，版本 96e02b1。许可：[CC-BY-SA-3.0](https://creativecommons.org/licenses/by-sa/3.0/)。本段由词元研究所借助 AI 重写导读、练习任务和边界说明，待教师审核；不表示原作者认可本平台。本改编段落同以 CC-BY-SA-3.0 提供；不改变平台其他独立内容的许可。"
