    text: "realloc、free 与所有权（待人工审核）\n\n把含 7、8 的动态数组扩展为四个元素，并补入 9、10。\n\n先检查 malloc 是否成功，再写入前两个元素。扩容前 p 拥有旧块。\n\n把 realloc 的结果交给 tmp：正尺寸扩容失败时，旧块仍属于 p，释放它后报告失败。\n\n成功后只使用返回的新指针，新增两个元素并没有自动初始化，必须先写入后读取。\n\n#include <stdio.h>\n#include <stdlib.h>\nint main(void) {\n    int *p = malloc(2 * sizeof *p);\n    if (p == NULL) return 1;\n    p[0] = 7; p[1] = 8;\n    int *tmp = realloc(p, 4 * sizeof *p);\n    if (tmp == NULL) {\n        free(p);\n        return 1;\n    }\n    p = tmp;\n    p[2] = 9; p[3] = 10;\n    printf(\"%d %d %d %d\\n\", p[0], p[1], p[2], p[3]);\n    free(p);\n    p = NULL;\n    return 0;\n}\n\n\n分配成功时输出 7 8 9 10；失败时退出码为 1。本例只申请固定的正尺寸，避开零尺寸 realloc 的特殊规则。成功后不可再使用旧指针及旧别名，即使返回地址看似未变。实际接收用户数量时还要先检查乘法溢出；不保证分配器时间复杂度。\n\n直接写 p = realloc(p, bytes)，在正尺寸分配失败时会丢失什么？"
