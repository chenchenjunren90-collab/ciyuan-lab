    text: "C-STR-01 字符数组与 C 字符串（自编讲义草稿，待人工审核）\n\n理解空字符终止约定和缓冲区容量。关键要点包括：C 字符串是以 '\\0' 结尾的字符序列，缓冲区容量必须包含终止符位置；字符串长度不包含终止符，但复制和拼接时必须为终止符保留空间；读取和遍历必须设置上界，不能假设外部输入一定包含合法终止符。\n\
      \nC 字符串是以 '\\0' 结尾的字符序列，缓冲区容量必须包含终止符位置。\n字符串长度不包含终止符，但复制和拼接时必须为终止符保留空间。\n读取和遍历必须设置上界，不能假设外部输入一定包含合法终止符。\n\
      \n观察字符串的字符数和数组容量为什么不同。\n\n初始化会保存 c、a、t、\\0 四个字符，sizeof word 为 4。\nstrlen 统计终止符之前的三个字符；它要求可达范围内存在终止符。\n\
      word 是可修改数组，替换首字符得到 bat；不能把字符串字面量当可写数组。\n\n#include <stdio.h>\n#include <string.h>\nint main(void)\
      \ {\n    char word[] = \"cat\";\n    printf(\"%zu %zu\\n\", strlen(word), sizeof word);\n  \
      \  word[0] = 'b';\n    puts(word);\n    return 0;\n}\n\n\n无终止符的字符数组不满足 C 字符串接口的前提，不能靠碰巧相邻的零字节。\n\
      \n常见错误：为5个可见字符只分配 char s[5]，没有终止符空间。；用 == 比较两个字符数组内容，而不是使用受控的字符串比较。\n\n自测：char word[3]={'c','a','t'}\
      \ 能直接传给 puts 吗？"
