  content:
    mode: inline
    text: C 标准库接口由头文件、函数原型、参数前置条件、返回值和错误约定共同定义。stdio 负责流式输入输出，stdlib 提供内存、转换与通用算法，string 处理字节串，ctype 分类字符，math 提供数学函数。可靠调用必须包含正确头文件并检查具体返回值。数值文本解析可使用 strtol 配合结束指针和 errno 检查格式与范围；atoi 不能可靠报告失败。ctype 函数参数应为 EOF 或转换成 unsigned char 的值。
