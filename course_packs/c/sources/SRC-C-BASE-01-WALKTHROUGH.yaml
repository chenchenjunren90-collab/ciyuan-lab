    text: "C-BASE-01 C 程序结构与编译运行（自编讲义草稿，待人工审核）\n\n理解源文件、预处理、编译、汇编、链接和执行的基本流程。关键要点包括：main 是托管环境 C 程序的入口，常用合法形式为\
      \ int main(void) 或 int main(int argc, char *argv[])；源文件先经预处理和编译生成汇编表示，再由汇编器形成目标文件，最后由链接器解析跨文件符号并生成可执行程序；编译成功不代表行为正确；警告、链接错误、退出状态和测试结果分别提供不同证据。\n\
      \nmain 是托管环境 C 程序的入口，常用合法形式为 int main(void) 或 int main(int argc, char *argv[])。\n源文件依次经过预处理、编译和汇编形成目标文件，最后由链接器解析跨文件符号并生成可执行程序。\n\
      编译成功不代表行为正确；警告、链接错误、退出状态和测试结果分别提供不同证据。\n\n从源文件到输出：编译一个打印 7 的最小程序。\n\n#include 引入头文件，其中提供标准输入输出接口声明；main\
      \ 是程序入口。\n编译器检查语法和类型，链接器解析 printf 等外部符号；编译通过并不证明逻辑正确。\n3 + 4 产生整数 7，%d 与 int 参数匹配；\\n 结束输出行。\n\
      \n#include <stdio.h>\nint main(void) {\n    int value = 3 + 4;\n    printf(\"%d\\n\", value);\n\
      \    return 0;\n}\n\n\n语法或声明问题依赖编译诊断；算法错误仍需要测试。建议使用 -std=c17 -Wall -Wextra -Wpedantic。\n\n常见错误：误以为C\
      \ 程序可以把 main 声明为 void main，并认为所有标准实现都会接受且行为一致。；误以为只要单个源文件编译成功，链接阶段就不会再出现未定义引用或重复定义。；把语法或类型错误、未定义符号和运行时错误都笼统称为“编译错误”，导致定位阶段错误。\n\
      \n自测：漏掉 stdio.h 与把 3 + 4 写成 3 - 4，分别可能在哪个阶段发现？"
