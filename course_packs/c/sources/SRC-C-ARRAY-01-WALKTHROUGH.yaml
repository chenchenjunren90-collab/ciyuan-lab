  content:
    mode: inline
    text: "C-ARRAY-01 一维数组（自编讲义草稿，待人工审核）\n\n按连续同类型元素建模并安全控制下标范围。关键要点包括：一维数组在创建时确定元素类型和长度，合法下标范围是 0\
      \ 到 n-1；数组表达式传入函数时通常转换为首元素指针，因此长度必须通过独立参数或结构一并传递；聚合操作在读取 a[0] 前必须先定义并处理 n==0 的空序列结果。\n\n一维数组在创建时确定元素类型和长度，合法下标范围是\
      \ 0 到 n-1。\n数组表达式传入函数时通常转换为首元素指针，因此长度必须通过独立参数或结构一并传递。\n聚合操作在读取 a[0] 前必须先定义并处理 n==0 的空序列结果。\n\
      \n安全遍历一个固定数组，空区间返回 0。\n\n在 a 仍为数组的调用方，sizeof a / sizeof a[0] 计算元素数。\n函数收到指针和长度；total 累积的顺序为\
      \ 3、1、6。\nn 为 0 时循环不进入，因此不会读取 NULL；n>0 时调用方必须提供足够长的有效数组。\n\n#include <stdio.h>\n#include <stddef.h>\n\
      static int sum(const int *a, size_t n) {\n    int total = 0;\n    for (size_t i = 0; i < n;\
      \ ++i) total += a[i];\n    return total;\n}\nint main(void) {\n    int a[] = {3, -2, 5};\n \
      \   printf(\"%d %d\\n\", sum(a, sizeof a / sizeof a[0]), sum(NULL, 0));\n    return 0;\n}\n\n\
      \n数组传参后的长度要显式传递；整数求和还需根据实际输入上界评估溢出。\n\n常见错误：误以为函数形参数组中使用 sizeof 可以恢复调用者数组的元素个数。；误以为长度为 n 的数组可以访问\
      \ a[n]，因为 n 表示最后一个元素位置。\n\n自测：为什么不能在 sum 的参数 a 上用 sizeof 得到调用方数组长度？"
