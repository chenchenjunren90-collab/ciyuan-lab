  <text x="892" y="744" class="cn cardTitle">课程辅导智能体</text>
  <text x="846" y="781" class="cn bodySmall">课程RAG · 苏格拉底引导 · 分级提示</text>
  <text x="846" y="814" class="cn mini">边界：负责“怎么学”，不能自证代码正确</text>

