      .subtitle { font-size: 25px; font-weight: 400; fill: #DCEBFF; }
      .badgeText { font-size: 24px; font-weight: 700; fill: #123B72; }
      .panelTitle { font-size: 27px; font-weight: 700; fill: #17365D; }
      .layerNo { font-size: 20px; font-weight: 700; fill: #3573B9; letter-spacing: 1px; }
